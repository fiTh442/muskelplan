<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muskelplan</title>
<meta name="description" content="Evidenzbasierter Muskelaufbau-Planer für dein Heim-Equipment – offline, ohne Konto.">
<meta name="theme-color" content="#f1f4f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0e0e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muskelplan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b6e69'/%3E%3Cpath d='M14 26h6v12h-6zM44 26h6v12h-6zM20 30h24v4H20zM8 29h6v6H8zM50 29h6v6h-6z' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* =========================================================
   DESIGN-TOKENS (Hell/Dunkel, WCAG-AA-Kontraste)
   Ruhige Flächen, ein klares Petrol als Leitfarbe, Koralle als Energie-Akzent
   ========================================================= */
:root {
  --bg:#f1f4f3; --surface:#ffffff; --surface-2:#f3f6f5; --surface-3:#e5ebe9;
  --text:#0e1514; --text-2:#4b5755; --text-3:#66726f;
  --border:#e0e6e4; --border-strong:#c9d2cf;
  --accent:#0a7b70; --accent-hover:#086a61; --accent-contrast:#ffffff; --accent-soft:#dcf2ee; --accent-ink:#075e56;
  --energy:#c93f15; --energy-soft:#fde9e1;
  --ok:#16794a; --ok-soft:#dff3e7; --warn:#8a5300; --warn-soft:#fdf1d8; --danger:#b42318; --danger-soft:#fde6e3;
  --info:#1d4ed8; --info-soft:#e8eefc;
  --focus:#1d4ed8;
  --hero-1:#0b8074; --hero-2:#0b5f6c; --hero-3:#173b5c;
  --shadow-sm:0 1px 2px rgba(15,23,22,.05);
  --shadow:0 1px 2px rgba(15,23,22,.04), 0 8px 24px -12px rgba(15,23,22,.14);
  --shadow-lg:0 18px 44px -18px rgba(9,40,38,.45);
  --radius:20px; --radius-sm:14px; --radius-xs:10px;
  --band:#0a7b7024;
  --glass:rgba(255,255,255,.82);
  --font:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display:ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0a0e0e; --surface:#121918; --surface-2:#18211f; --surface-3:#22302d;
    --text:#e8efed; --text-2:#a9b6b3; --text-3:#8d9a97;
    --border:#1f2b29; --border-strong:#31423e;
    --accent:#3fd1bf; --accent-hover:#66ddcf; --accent-contrast:#03221e; --accent-soft:#0f2f2b; --accent-ink:#86e6da;
    --energy:#ff9067; --energy-soft:#3a1c11;
    --ok:#62d391; --ok-soft:#10301e; --warn:#f2c066; --warn-soft:#33270e; --danger:#ff8b80; --danger-soft:#3a1512;
    --info:#93b6ff; --info-soft:#14213b;
    --focus:#8ab4ff;
    --hero-1:#0f665d; --hero-2:#0d4a56; --hero-3:#142e48;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 2px rgba(0,0,0,.45);
    --shadow-lg:0 18px 44px -18px rgba(0,0,0,.7);
    --band:#3fd1bf26;
    --glass:rgba(18,25,24,.82);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0a0e0e; --surface:#121918; --surface-2:#18211f; --surface-3:#22302d;
  --text:#e8efed; --text-2:#a9b6b3; --text-3:#8d9a97;
  --border:#1f2b29; --border-strong:#31423e;
  --accent:#3fd1bf; --accent-hover:#66ddcf; --accent-contrast:#03221e; --accent-soft:#0f2f2b; --accent-ink:#86e6da;
  --energy:#ff9067; --energy-soft:#3a1c11;
  --ok:#62d391; --ok-soft:#10301e; --warn:#f2c066; --warn-soft:#33270e; --danger:#ff8b80; --danger-soft:#3a1512;
  --info:#93b6ff; --info-soft:#14213b;
  --focus:#8ab4ff;
  --hero-1:#0f665d; --hero-2:#0d4a56; --hero-3:#142e48;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.45);
  --shadow-lg:0 18px 44px -18px rgba(0,0,0,.7);
  --band:#3fd1bf26;
  --glass:rgba(18,25,24,.82);
  color-scheme: dark;
}

/* ================= Basis ================= */
*,*::before,*::after { box-sizing:border-box; }
[hidden] { display:none !important; }
html { -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font); font-size:16px; line-height:1.5;
  padding-bottom:calc(104px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4 { font-family:var(--font-display); line-height:1.2; margin:0 0 .5rem; letter-spacing:-.015em; }
h1 { font-size:1.9rem; font-weight:800; letter-spacing:-.025em; }
h2 { font-size:1.18rem; font-weight:750; }
h3 { font-size:1.02rem; font-weight:700; }
h4 { font-size:.95rem; font-weight:700; }
p { margin:0 0 .6rem; }
a { color:var(--accent); }
small, .small { font-size:.86rem; }
.muted { color:var(--text-2); }
.tnum, .num, table { font-variant-numeric:tabular-nums; }
.sr-only { position:absolute !important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
:focus-visible { outline:3px solid var(--focus); outline-offset:2px; border-radius:8px; }
.skip { position:absolute; left:-999px; top:8px; background:var(--surface); color:var(--text); padding:10px 14px; z-index:100; border-radius:10px; }
.skip:focus { left:8px; }
hr { border:0; border-top:1px solid var(--border); margin:1rem 0; }
ul.clean { list-style:none; padding:0; margin:0; }
ul.list { padding-left:1.2rem; margin:.3rem 0 .6rem; }
ul.list li { margin:.2rem 0; }

/* ================= Layout ================= */
/* Kein backdrop-filter am Header auf dem Handy: er würde die fixierte Navigationsleiste (Kind des Headers) mitnehmen */
.app-header {
  position:sticky; top:0; z-index:30;
  background:color-mix(in srgb, var(--bg) 94%, transparent);
  border-bottom:1px solid color-mix(in srgb, var(--border) 70%, transparent);
  display:flex; align-items:center; gap:12px; padding:8px 16px; padding-top:calc(8px + env(safe-area-inset-top));
}
.brand { display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:800; font-size:1.08rem; letter-spacing:-.01em; margin-right:auto; }
.brand svg { width:32px; height:32px; flex:none; border-radius:10px; box-shadow:0 4px 12px -4px rgba(10,123,112,.55); }
main { max-width:760px; margin:0 auto; padding:18px 16px 8px; }
main:focus { outline:none; }

.page-head { margin:6px 2px 16px; }
.page-head h1 { margin:0; }
.eyebrow { font-size:.78rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); margin-bottom:4px; }
.section-label { font-size:.78rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); margin:22px 4px 10px; display:flex; align-items:center; justify-content:space-between; gap:8px; }

/* Untere Navigation: schwebende Leiste */
.tabbar {
  position:fixed; left:12px; right:12px; bottom:calc(10px + env(safe-area-inset-bottom)); z-index:40;
  display:grid; grid-template-columns:repeat(5,1fr); gap:2px; padding:6px;
  background:var(--glass); -webkit-backdrop-filter:saturate(1.6) blur(18px); backdrop-filter:saturate(1.6) blur(18px);
  border:1px solid color-mix(in srgb, var(--border) 80%, transparent); border-radius:24px; box-shadow:var(--shadow-lg);
  max-width:560px; margin:0 auto;
}
.tabbar button {
  appearance:none; border:0; background:none; color:var(--text-2); border-radius:18px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  min-height:56px; font:inherit; font-size:.7rem; font-weight:600; cursor:pointer; padding:4px 2px;
  transition:color .15s, background .15s;
}
.tabbar button svg { width:22px; height:22px; }
.tabbar button[aria-current="page"] { color:var(--accent-ink); background:var(--accent-soft); }
.tabbar button[aria-current="page"] svg { stroke-width:2.4; }
@media (min-width: 900px) {
  body { padding-bottom:24px; }
  .tabbar { position:static; display:flex; gap:4px; border:0; padding:0; background:none; box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none; max-width:none; margin:0; }
  .tabbar button { flex-direction:row; min-height:40px; padding:0 14px; font-size:.92rem; border-radius:12px; gap:7px; }
  .tabbar button svg { width:18px; height:18px; }
  .tabbar button:hover { background:var(--surface-2); color:var(--text); }
  main { padding:28px 16px 16px; }
  .app-header { background:var(--glass); -webkit-backdrop-filter:saturate(1.6) blur(18px); backdrop-filter:saturate(1.6) blur(18px); }
}
/* Einrichtung: volle Konzentration, ohne Navigationsleiste */
body.ob-mode { padding-bottom:calc(24px + env(safe-area-inset-bottom)); }
body.ob-mode .tabbar { display:none; }

/* ================= Komponenten ================= */
.card {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px; margin-bottom:14px; box-shadow:var(--shadow);
}
.card.flat { box-shadow:none; }
.card.soft { background:var(--surface-2); box-shadow:none; }
.card > h2:first-child, .card > h3:first-child { margin-top:0; }
.card-head { display:flex; align-items:flex-start; gap:10px; justify-content:space-between; margin-bottom:.5rem; }
.card-head h2, .card-head h3 { margin:0; }
.card-sub { color:var(--text-2); font-size:.9rem; margin:2px 0 0; }
.section-title { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:22px 0 10px; }
.section-title h2 { margin:0; }

.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.row.between { justify-content:space-between; }
.stack > * + * { margin-top:10px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
@media (max-width:480px){ .grid3 { grid-template-columns:1fr 1fr; } }

.btn {
  appearance:none; font:inherit; font-weight:650; cursor:pointer;
  min-height:44px; padding:10px 18px; border-radius:14px;
  border:1px solid var(--border-strong); background:var(--surface); color:var(--text);
  display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none;
  transition:background .15s, border-color .15s, transform .08s, box-shadow .15s;
}
.btn:hover { background:var(--surface-2); }
.btn:active { transform:scale(.98); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-contrast); box-shadow:0 6px 16px -8px color-mix(in srgb, var(--accent) 80%, transparent); }
.btn.primary:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
.btn.danger { color:var(--danger); border-color:color-mix(in srgb, var(--danger) 55%, transparent); background:transparent; }
.btn.danger:hover { background:var(--danger-soft); }
.btn.danger.solid { background:var(--danger); color:#fff; border-color:var(--danger); }
.btn.ghost { border-color:transparent; background:transparent; color:var(--text-2); }
.btn.ghost:hover { background:var(--surface-2); color:var(--text); }
.btn.soft { background:var(--accent-soft); border-color:transparent; color:var(--accent-ink); }
.btn.soft:hover { background:color-mix(in srgb, var(--accent-soft) 70%, var(--accent) 12%); }
.btn.sm { min-height:44px; padding:6px 13px; font-size:.9rem; border-radius:12px; }
.btn.lg { min-height:54px; padding:12px 22px; font-size:1.05rem; border-radius:16px; }
.btn.block { width:100%; }
.btn[disabled] { opacity:.5; cursor:not-allowed; }
.icon-btn {
  appearance:none; border:1px solid var(--border); background:var(--surface); color:var(--text);
  width:44px; height:44px; border-radius:14px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
}
.icon-btn:hover { background:var(--surface-2); }
.icon-btn svg { width:20px; height:20px; }

.chip { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:999px; background:var(--surface-2); color:var(--text-2); font-size:.78rem; font-weight:600; border:1px solid var(--border); white-space:nowrap; line-height:1.3; }
.chip.accent { background:var(--accent-soft); color:var(--accent-ink); border-color:transparent; }
.chip.warn { background:var(--warn-soft); color:var(--warn); border-color:transparent; }
.chip.danger { background:var(--danger-soft); color:var(--danger); border-color:transparent; }
.chip.ok { background:var(--ok-soft); color:var(--ok); border-color:transparent; }
.chip.energy { background:var(--energy-soft); color:var(--energy); border-color:transparent; }

/* „Warum?“-Knopf: kurze Erklärung in Alltagssprache */
.why {
  appearance:none; font:inherit; cursor:pointer; font-size:.8rem; font-weight:650; position:relative;
  border:0; background:var(--surface-2); color:var(--text-2);
  border-radius:999px; padding:3px 10px 3px 6px; min-height:28px; display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
}
.why svg { width:16px; height:16px; }
.why:hover { background:var(--surface-3); color:var(--text); }
.why::after { content:""; position:absolute; left:-2px; right:-2px; top:-8px; bottom:-8px; } /* Trefferfläche ≥ 44 px */

.notice { border-radius:var(--radius-sm); padding:12px 14px; margin:10px 0; border:1px solid transparent; font-size:.94rem; }
.notice.warn { background:var(--warn-soft); color:var(--text); border-color:color-mix(in srgb, var(--warn) 25%, transparent); }
.notice.danger { background:var(--danger-soft); border-color:color-mix(in srgb, var(--danger) 25%, transparent); }
.notice.info { background:var(--info-soft); border-color:color-mix(in srgb, var(--info) 20%, transparent); }
.notice.ok { background:var(--ok-soft); border-color:color-mix(in srgb, var(--ok) 22%, transparent); }
.notice.energy { background:var(--energy-soft); border-color:color-mix(in srgb, var(--energy) 22%, transparent); }
.notice strong:first-child { display:block; margin-bottom:2px; }

/* Formulare */
.field { margin-bottom:14px; }
.field > label, .field > .label, fieldset > legend { display:block; font-weight:650; margin-bottom:8px; font-size:.95rem; }
.hint { color:var(--text-2); font-size:.86rem; margin-top:6px; }
input[type=text], input[type=number], input[type=date], input[type=password], input:not([type]), select, textarea {
  font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--border-strong);
  border-radius:12px; min-height:46px; padding:9px 13px; width:100%;
  transition:border-color .15s, box-shadow .15s;
}
input:focus, select:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); outline:none; }
textarea { min-height:84px; resize:vertical; }
input[aria-invalid="true"] { border-color:var(--danger); box-shadow:0 0 0 1px var(--danger); }
fieldset { border:0; padding:0; margin:0 0 18px; min-width:0; }
.opt-list { display:grid; gap:10px; }
.opt-list.cols2 { grid-template-columns:1fr 1fr; }
@media (max-width:420px){ .opt-list.cols2 { grid-template-columns:1fr; } }
.opt {
  display:flex; align-items:flex-start; gap:12px; padding:14px; border:1px solid var(--border-strong);
  border-radius:16px; cursor:pointer; background:var(--surface); min-height:48px;
  transition:border-color .15s, background .15s, box-shadow .15s;
}
.opt:hover { background:var(--surface-2); }
.opt input { width:20px; height:20px; margin:2px 0 0; flex:none; accent-color:var(--accent); }
.opt:has(input:checked) { border-color:var(--accent); background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent); }
.opt:has(input:disabled) { opacity:.55; cursor:not-allowed; }
.opt .opt-title { font-weight:650; display:block; }
.opt .opt-desc { font-size:.86rem; color:var(--text-2); display:block; margin-top:2px; }
.opt .opt-icon { font-size:1.4rem; line-height:1; flex:none; }

.seg { display:flex; flex-wrap:wrap; gap:8px; }
.seg label { position:relative; }
.seg input { position:absolute; opacity:0; width:1px; height:1px; }
.seg span {
  display:inline-flex; align-items:center; justify-content:center; gap:6px; min-width:48px; min-height:44px; padding:6px 15px;
  border:1px solid var(--border-strong); border-radius:999px; cursor:pointer; background:var(--surface); font-weight:650; font-size:.95rem;
  transition:background .15s, border-color .15s, color .15s;
}
.seg span:hover { background:var(--surface-2); }
.seg input:checked + span { background:var(--accent); color:var(--accent-contrast); border-color:var(--accent); }
.seg input:focus-visible + span { outline:3px solid var(--focus); outline-offset:2px; }
.seg.energy input:checked + span { background:var(--energy); border-color:var(--energy); color:#fff; }
.seg input:disabled + span { opacity:.4; cursor:not-allowed; }
.toggle2 span svg, .ex-idx svg { width:18px; height:18px; flex:none; }
details[open] > summary .when-closed { display:none; }
.seg.days { display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; }
.seg.days span { min-width:0; width:100%; padding:6px 0; }
.seg.days label.hb span { box-shadow:inset 0 -3px 0 var(--energy); }
.seg.days label.hb input:checked + span { box-shadow:inset 0 -3px 0 color-mix(in srgb, var(--energy) 80%, #fff); }

.switch { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:48px; padding:8px 0; cursor:pointer; }
.switch + .switch { border-top:1px solid var(--border); }
.switch input { appearance:none; width:50px; height:30px; border-radius:999px; background:var(--surface-3); border:1px solid var(--border-strong); position:relative; cursor:pointer; flex:none; transition:background .15s; }
.switch input::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .18s; }
.switch input:checked { background:var(--accent); border-color:var(--accent); }
.switch input:checked::after { transform:translateX(20px); }
.switch input:disabled { opacity:.5; }
.switch .sw-text { flex:1; font-weight:600; }
.switch .sw-text small { display:block; color:var(--text-2); font-weight:400; }

/* Fortschritt */
.progress { height:8px; background:var(--surface-3); border-radius:999px; overflow:hidden; }
.progress > span { display:block; height:100%; background:linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #7ef0e0)); border-radius:999px; transition:width .3s; }

/* Tabellen */
.table-wrap { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:.92rem; }
th, td { text-align:left; padding:9px 6px; border-bottom:1px solid var(--border); vertical-align:top; }
th { color:var(--text-2); font-weight:600; font-size:.84rem; }
td.r, th.r { text-align:right; }
tr:last-child > td, tr:last-child > th { border-bottom:0; }

/* ================= Heute: Hero ================= */
.hero {
  position:relative; overflow:hidden; isolation:isolate;
  border-radius:26px; padding:20px 20px 18px; margin-bottom:14px; color:#fff;
  background:linear-gradient(145deg, var(--hero-1) 0%, var(--hero-2) 55%, var(--hero-3) 100%);
  box-shadow:var(--shadow-lg);
}
.hero::before, .hero::after { content:""; position:absolute; border-radius:50%; z-index:-1; pointer-events:none; }
.hero::before { width:260px; height:260px; right:-90px; top:-110px; background:radial-gradient(circle, rgba(255,255,255,.22), rgba(255,255,255,0) 70%); }
.hero::after { width:200px; height:200px; left:-80px; bottom:-120px; background:radial-gradient(circle, rgba(126,240,224,.28), rgba(126,240,224,0) 70%); }
.hero .eyebrow { color:rgba(255,255,255,.78); }
.hero-title { font-family:var(--font-display); font-size:2rem; font-weight:800; letter-spacing:-.03em; line-height:1.1; margin:2px 0 10px; color:#fff; }
.hero-tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
.hero-tag { display:inline-flex; align-items:center; gap:5px; font-size:.8rem; font-weight:650; padding:4px 10px; border-radius:999px; background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.18); }
.hero-tag.hot { background:rgba(255,144,103,.28); border-color:rgba(255,170,140,.4); }
.hero-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:4px 0 16px; }
.hero-stat { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.14); border-radius:16px; padding:10px 12px; }
.hero-stat b { display:block; font-family:var(--font-display); font-size:1.35rem; font-weight:800; line-height:1.1; font-variant-numeric:tabular-nums; }
.hero-stat span { font-size:.76rem; opacity:.82; }
.hero-cta { width:100%; min-height:56px; border:0; border-radius:18px; background:#fff; color:#0b4f49; font:inherit; font-weight:800; font-size:1.08rem; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 10px 24px -12px rgba(0,0,0,.5); transition:transform .08s; }
.hero-cta:active { transform:scale(.985); }
.hero-cta svg { width:22px; height:22px; }
.hero-foot { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; font-size:.82rem; color:rgba(255,255,255,.8); }
.hero-bar { flex:1; height:6px; border-radius:999px; background:rgba(255,255,255,.18); overflow:hidden; }
.hero-bar > span { display:block; height:100%; background:#fff; border-radius:999px; }
.hero .notice { color:var(--text); }

/* Ort-Umschalter (Kraftraum / Zuhause) */
.toggle2 { display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; border-radius:16px; background:var(--surface-3); }
.toggle2 label { position:relative; }
.toggle2 input { position:absolute; opacity:0; width:1px; height:1px; }
.toggle2 span { display:flex; align-items:center; justify-content:center; gap:6px; min-height:42px; border-radius:12px; font-weight:650; font-size:.95rem; cursor:pointer; color:var(--text-2); transition:background .15s, color .15s; }
.toggle2 input:checked + span { background:var(--surface); color:var(--text); box-shadow:var(--shadow-sm); }
.toggle2 input:focus-visible + span { outline:3px solid var(--focus); outline-offset:2px; }

/* Übungsliste (Heute, Plan) */
.ex-list { list-style:none; margin:0; padding:0; }
.ex-li { display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--border); }
.ex-li:first-child { border-top:0; }
.ex-li.off { opacity:.55; }
.ex-li.off .ex-name { text-decoration:line-through; }
.ex-idx { flex:none; width:30px; height:30px; border-radius:10px; background:var(--surface-2); color:var(--text-2); display:inline-flex; align-items:center; justify-content:center; font-weight:750; font-size:.85rem; font-variant-numeric:tabular-nums; }
.ex-idx.warm { background:var(--accent-soft); color:var(--accent-ink); }
.ex-idx.power { background:var(--energy-soft); color:var(--energy); }
.ex-body { flex:1; min-width:0; }
.ex-name { font-weight:650; display:block; line-height:1.3; }
.ex-sub { display:block; font-size:.84rem; color:var(--text-2); margin-top:1px; }
.ex-dose { flex:none; text-align:right; font-variant-numeric:tabular-nums; }
.ex-dose b { display:block; font-size:.98rem; }
.ex-dose small { color:var(--text-2); font-size:.78rem; }

/* Wochenleiste: Krafttage + Zusatzsport auf einen Blick */
.week-strip { display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; }
.wd { display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 2px 9px; border-radius:14px; background:var(--surface-2); min-width:0; }
.wd.today { box-shadow:inset 0 0 0 2px var(--accent); }
.wd-name { font-size:.72rem; font-weight:700; color:var(--text-2); text-transform:uppercase; letter-spacing:.04em; }
.wd-slot { width:30px; height:30px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; font-size:.78rem; font-weight:800; line-height:1; }
.wd-slot.gym { background:var(--accent); color:var(--accent-contrast); }
.wd-slot.gym.leg { background:color-mix(in srgb, var(--accent) 55%, var(--hero-3)); color:#fff; }
.wd-slot.sport { background:var(--energy-soft); color:var(--energy); font-size:1rem; }
.wd-slot.match { background:var(--energy); color:#fff; font-size:.95rem; }
.wd-slot.rest { background:transparent; color:var(--text-3); font-weight:500; }
.wd-slot.done { opacity:.45; }
.week-legend { display:flex; flex-wrap:wrap; gap:10px 14px; margin-top:10px; font-size:.8rem; color:var(--text-2); }
.week-legend i { display:inline-block; width:12px; height:12px; border-radius:4px; vertical-align:-1px; margin-right:5px; }

/* ================= Plan ================= */
.day-card { padding:0; overflow:hidden; }
.day-card > summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:12px; padding:14px 16px; min-height:64px; }
.day-card > summary::-webkit-details-marker { display:none; }
.day-card > summary .chev { transition:transform .2s; width:22px; height:22px; flex:none; color:var(--text-3); }
.day-card[open] > summary .chev { transform:rotate(180deg); }
.day-card[open] > summary { border-bottom:1px solid var(--border); }
.day-badge { flex:none; width:46px; height:46px; border-radius:14px; background:var(--accent-soft); color:var(--accent-ink); display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:800; line-height:1.05; font-family:var(--font-display); }
.day-badge small { font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; opacity:.8; }
.day-badge.leg { background:color-mix(in srgb, var(--accent) 22%, var(--surface)); }
.day-badge.done { background:var(--ok-soft); color:var(--ok); }
.day-head { flex:1; min-width:0; }
.day-head h3 { margin:0; display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
.day-head .meta { margin:2px 0 0; }
.day-body { padding:6px 16px 14px; }

.ex-row { border-top:1px solid var(--border); }
.ex-row:first-of-type { border-top:0; }
.ex-row > summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:12px; padding:12px 0; min-height:56px; }
.ex-row > summary::-webkit-details-marker { display:none; }
.ex-row[open] > summary .ex-name { color:var(--accent-ink); }
.ex-detail { padding:0 0 14px 42px; }
.ex-detail .meta { margin:4px 0; }
.block-line { display:flex; align-items:flex-start; gap:12px; padding:10px 12px; margin:8px 0; border-radius:14px; background:var(--surface-2); font-size:.9rem; }
.block-line.power { background:var(--energy-soft); }
.block-line .bl-title { font-weight:700; display:block; }
.block-line .bl-text { color:var(--text-2); }
.block-line.power .bl-title { color:var(--energy); }

.ex-item { border-top:1px solid var(--border); padding:12px 0; }
.ex-item:first-of-type { border-top:0; }
.ex-title { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; }
.ex-title h4 { margin:0; font-size:1rem; }
.presc { font-weight:650; margin:4px 0; }
.meta { font-size:.86rem; color:var(--text-2); margin:2px 0; }
.ss-tag { font-size:.74rem; font-weight:750; color:var(--warn); background:var(--warn-soft); padding:2px 8px; border-radius:999px; white-space:nowrap; }
.week-chips { display:flex; gap:6px; overflow-x:auto; padding:2px 2px 6px; scrollbar-width:none; }
.week-chips::-webkit-scrollbar { display:none; }
.week-chips button { flex:none; border-radius:999px; }
.week-chips .btn[aria-pressed="true"] { background:var(--text); color:var(--bg); border-color:var(--text); }
.week-chips .btn .dot-done { width:7px; height:7px; border-radius:50%; background:var(--ok); display:inline-block; }

/* Volumen-Balken */
.vol-row { display:grid; grid-template-columns:minmax(104px, 32%) 1fr 64px; gap:10px; align-items:center; padding:6px 0; font-size:.88rem; }
.vol-track { position:relative; height:14px; background:var(--surface-2); border-radius:999px; overflow:hidden; }
.vol-band { position:absolute; top:0; bottom:0; background:var(--band); }
.vol-fill { position:absolute; left:0; top:3px; height:8px; border-radius:999px; background:var(--accent); }
.vol-fill.low { background:var(--warn); }
.vol-fill.high { background:var(--danger); }
.vol-target { position:absolute; top:0; bottom:0; width:2px; background:var(--text); opacity:.55; }
.vol-legend { display:flex; flex-wrap:wrap; gap:12px; font-size:.8rem; color:var(--text-2); margin-top:10px; }
.vol-legend i { display:inline-block; width:14px; height:10px; border-radius:3px; vertical-align:middle; margin-right:4px; }

/* ================= Training (Logger) ================= */
.wo-head {
  position:sticky; top:calc(57px + env(safe-area-inset-top)); z-index:20; margin:-6px -16px 14px; padding:10px 16px 12px;
  background:var(--glass); -webkit-backdrop-filter:saturate(1.6) blur(18px); backdrop-filter:saturate(1.6) blur(18px);
  border-bottom:1px solid color-mix(in srgb, var(--border) 70%, transparent);
}
.wo-head h1 { font-size:1.35rem; margin:0; }
.wo-head .progress { margin-top:10px; height:6px; }
.ex-card-head { display:flex; align-items:flex-start; gap:12px; }
.ex-card-head .ex-idx { width:34px; height:34px; border-radius:12px; background:var(--accent-soft); color:var(--accent-ink); }
.ex-card-head .ex-idx.done { background:var(--ok); color:#fff; }
.presc-pills { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 4px; }
.pill { display:inline-flex; align-items:baseline; gap:4px; padding:5px 11px; border-radius:999px; background:var(--surface-2); font-size:.85rem; color:var(--text-2); font-variant-numeric:tabular-nums; }
.pill b { color:var(--text); font-size:.95rem; }
.set-grid { display:grid; grid-template-columns:34px 1fr 1fr 74px 48px; gap:8px; align-items:center; }
.set-grid.no-w { grid-template-columns:34px 1fr 74px 48px; }
.set-head { font-size:.76rem; color:var(--text-3); font-weight:700; padding:6px 2px 0; text-transform:uppercase; letter-spacing:.04em; }
.set-row { padding:4px 0; }
.set-row input, .set-row select { min-height:46px; padding:6px 8px; text-align:center; font-weight:650; font-size:1.02rem; border-radius:12px; background:var(--surface-2); border-color:transparent; }
.set-row input:focus, .set-row select:focus { background:var(--surface); }
.set-no { text-align:center; font-weight:750; color:var(--text-3); }
.set-row.done input, .set-row.done select { background:var(--ok-soft); border-color:transparent; color:var(--ok); }
.set-row.skipped { opacity:.45; }
.set-row.skipped input { text-decoration:line-through; }
.check-btn { width:46px; height:46px; border-radius:14px; border:1.5px solid var(--border-strong); background:var(--surface); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; color:var(--text-3); transition:background .15s, border-color .15s, transform .08s; }
.check-btn:active { transform:scale(.94); }
.check-btn[aria-pressed="true"] { background:var(--ok); color:#fff; border-color:var(--ok); }
.check-btn svg { width:22px; height:22px; }
.pr-flag { color:var(--energy); font-weight:800; font-size:.72rem; }
.suggest { border-radius:14px; padding:11px 13px; margin:10px 0; background:var(--surface-2); font-size:.92rem; }
.suggest.increase { background:var(--ok-soft); }
.suggest.cap, .suggest.bridge, .suggest.stagnation { background:var(--warn-soft); }
.suggest.deload { background:var(--info-soft); }
.suggest ol { margin:6px 0 0; padding-left:1.2rem; }
.suggest li.active { font-weight:700; }
.warm-list { font-size:.88rem; color:var(--text-2); }
.ex-tools { display:flex; flex-wrap:nowrap; gap:6px; margin:10px -18px 0; padding:0 18px 2px; overflow-x:auto; scrollbar-width:none; }
.ex-tools::-webkit-scrollbar { display:none; }
.ex-tools .btn { flex:none; }

/* Aufwärmen, Sprungkraft & Cooldown */
.wc-plan { font-size:.88rem; margin:10px 0; padding:10px 12px; background:var(--surface-2); border-radius:var(--radius-sm); }
.wc-plan .row { margin-bottom:4px; }
.wc-line { margin:3px 0; color:var(--text-2); }
.wc-phase { display:inline-block; font-size:.68rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--accent-ink); margin-right:6px; }
.wc-list { list-style:none; padding:0; margin:8px 0 0; }
.wc-item { display:grid; grid-template-columns:46px 1fr auto; gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--border); }
.wc-item:first-child { border-top:0; }
.wc-name { font-weight:650; }
.wc-dose { color:var(--text-2); }
.wc-cue { font-size:.86rem; color:var(--text-2); }
.wc-item.done .wc-name { color:var(--text-2); text-decoration:line-through; }
.power-card { border-color:color-mix(in srgb, var(--energy) 30%, var(--border)); }
.power-card .wc-phase { color:var(--energy); }

/* Tagesform */
.limit-box fieldset { margin:6px 0 14px; }
.limit-box .seg span { min-width:auto; font-weight:550; }
.ci-row { display:grid; grid-template-columns:minmax(90px, 30%) 1fr; gap:10px; align-items:center; margin-bottom:10px; }
.ci-row .seg { flex-wrap:nowrap; gap:5px; }
.ci-row .seg label { flex:1; }
.ci-row .seg span { min-width:0; width:100%; padding:6px 0; }
.ci-label { font-weight:600; font-size:.92rem; }
.ci-label small { display:block; color:var(--text-2); font-weight:400; font-size:.78rem; }
details.fold > summary { list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:2px 0; min-height:44px; }
details.fold > summary::-webkit-details-marker { display:none; }
details.fold > summary .chev { width:22px; height:22px; color:var(--text-3); transition:transform .2s; flex:none; }
details.fold[open] > summary .chev { transform:rotate(180deg); }
details.fold > summary h2, details.fold > summary h3 { margin:0; }
.fold-body { padding-top:10px; }

.timer-bar {
  position:fixed; left:12px; right:12px; bottom:calc(92px + env(safe-area-inset-bottom)); z-index:45;
  background:var(--text); color:var(--bg); border-radius:20px; padding:10px 12px;
  display:flex; align-items:center; gap:10px; box-shadow:0 14px 36px -10px rgba(0,0,0,.45); max-width:560px; margin:0 auto;
}
.timer-bar .t-time { font-family:var(--font-display); font-size:1.6rem; font-weight:800; font-variant-numeric:tabular-nums; min-width:76px; }
.timer-bar .t-label { flex:1; font-size:.85rem; opacity:.85; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.timer-bar button { appearance:none; border:1px solid currentColor; background:transparent; color:inherit; border-radius:12px; min-height:44px; min-width:44px; font:inherit; font-weight:700; cursor:pointer; padding:0 10px; }
.timer-bar.done { background:var(--ok); color:#fff; }
@media (min-width:900px){ .timer-bar { bottom:20px; } }

.toasts { position:fixed; left:0; right:0; top:calc(68px + env(safe-area-inset-top)); z-index:60; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; padding:0 12px; }
.toast { pointer-events:auto; background:var(--text); color:var(--bg); padding:11px 16px; border-radius:14px; box-shadow:0 10px 30px -10px rgba(0,0,0,.35); max-width:520px; font-size:.93rem; font-weight:550; animation:toast-in .22s ease-out; }
@keyframes toast-in { from { opacity:0; transform:translateY(-8px) scale(.98); } to { opacity:1; transform:none; } }

/* Dialog */
dialog {
  border:1px solid var(--border); border-radius:24px; padding:0; background:var(--surface); color:var(--text);
  width:min(560px, calc(100vw - 24px)); max-height:calc(100vh - 40px); box-shadow:0 24px 70px rgba(0,0,0,.35);
}
dialog::backdrop { background:rgba(8,14,14,.5); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
.dlg-inner { padding:20px; overflow:auto; max-height:calc(100vh - 40px); }
.dlg-actions { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; margin-top:18px; }
.dlg-close { float:right; margin:-6px -6px 0 8px; }

/* Einrichtung (Plangestalter) */
.ob-wrap { max-width:640px; margin:0 auto; }
.ob-top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:2px 2px 12px; }
.ob-steps { display:flex; gap:5px; flex:1; }
.ob-steps span { height:5px; flex:1; border-radius:999px; background:var(--surface-3); transition:background .2s; }
.ob-steps span.on { background:var(--accent); }
.ob-count { font-size:.82rem; font-weight:650; color:var(--text-2); white-space:nowrap; }
.ob-card { padding:22px 20px; }
.ob-card h2 { font-size:1.45rem; font-weight:800; letter-spacing:-.02em; margin-bottom:4px; }
.ob-lead { color:var(--text-2); margin-bottom:18px; }
.ob-nav {
  position:sticky; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:10;
  display:flex; gap:10px; margin-top:6px; padding:10px; border-radius:20px;
  background:var(--glass); -webkit-backdrop-filter:saturate(1.6) blur(18px); backdrop-filter:saturate(1.6) blur(18px);
  border:1px solid color-mix(in srgb, var(--border) 80%, transparent); box-shadow:var(--shadow);
}
.ob-nav .btn { flex:1; }
.ob-nav .btn.primary { flex:2; }
.parq-list { list-style:none; margin:0 0 16px; padding:12px 14px; border-radius:16px; background:var(--surface-2); counter-reset:q; }
.parq-list li { counter-increment:q; display:flex; gap:10px; padding:6px 0; font-size:.93rem; }
.parq-list li::before { content:counter(q); flex:none; width:22px; height:22px; border-radius:7px; background:var(--surface); color:var(--text-2); font-size:.75rem; font-weight:750; display:inline-flex; align-items:center; justify-content:center; margin-top:1px; }
.sport-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:8px; }
.sport-grid label { position:relative; }
.sport-grid input { position:absolute; opacity:0; width:1px; height:1px; }
.sport-grid span { display:flex; align-items:center; gap:8px; min-height:50px; padding:8px 12px; border-radius:14px; border:1px solid var(--border-strong); background:var(--surface); font-weight:650; font-size:.92rem; cursor:pointer; line-height:1.2; }
.sport-grid span i { font-style:normal; font-size:1.3rem; }
.sport-grid input:checked + span { border-color:var(--accent); background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent); }
.sport-grid input:focus-visible + span { outline:3px solid var(--focus); outline-offset:2px; }
.effect-list { list-style:none; margin:8px 0 0; padding:0; }
.effect-list li { display:flex; gap:10px; padding:7px 0; font-size:.93rem; align-items:flex-start; }
.effect-list li > i { font-style:normal; flex:none; width:28px; height:28px; border-radius:9px; background:var(--surface); display:inline-flex; align-items:center; justify-content:center; font-size:.95rem; }
.summary-list { display:grid; grid-template-columns:auto 1fr; gap:8px 16px; margin:0; font-size:.94rem; }
.summary-list dt { color:var(--text-2); }
.summary-list dd { margin:0; font-weight:600; }

/* Charts */
.chart { width:100%; height:auto; display:block; }
.chart text { fill:var(--text-2); font-size:11px; font-family:inherit; }
.chart .grid { stroke:var(--border); stroke-width:1; }
.chart .line { fill:none; stroke:var(--accent); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round; }
.chart .pt { fill:var(--surface); stroke:var(--accent); stroke-width:2; }
.chart .bar { fill:var(--accent); }
.chart .bar.low { fill:var(--warn); }
.chart .band { fill:var(--band); }
.heat rect { stroke:var(--surface); stroke-width:2; }
.stat-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:10px; }
.stat { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:14px; box-shadow:var(--shadow-sm); }
.card .stat, dialog .stat { background:var(--surface-2); border-color:transparent; box-shadow:none; }
dialog .stat-grid { clear:both; grid-template-columns:1fr 1fr; }
.stat .v { font-family:var(--font-display); font-size:1.5rem; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
.stat .l { font-size:.8rem; color:var(--text-2); }

.empty { text-align:center; padding:32px 18px; color:var(--text-2); }
.empty svg { width:52px; height:52px; opacity:.55; margin-bottom:8px; }
.empty h2 { color:var(--text); }
.kbd-cue li { margin:.15rem 0; }
.knowledge-card h3 { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.macro-bar { display:flex; height:12px; border-radius:999px; overflow:hidden; margin:10px 0; gap:2px; }
.macro-bar span { display:block; height:100%; }
.data-chips { display:flex; flex-wrap:wrap; gap:6px; }
.link-card { display:flex; align-items:center; gap:14px; width:100%; text-align:left; cursor:pointer; font:inherit; color:inherit; }
.link-card:hover { background:var(--surface-2); }
.link-card .ex-idx { width:42px; height:42px; border-radius:14px; }
.link-card .lc-text { flex:1; min-width:0; }
.link-card .lc-text strong { display:block; }
.link-card .lc-chev { width:20px; height:20px; flex:none; color:var(--text-3); }

.btn svg { width:18px; height:18px; flex:none; }
.timer-bar svg { width:18px; height:18px; }
.active-banner { display:flex; align-items:center; justify-content:space-between; gap:10px; }
details > summary { cursor:pointer; padding:10px 0; }
.day-card > summary, details.fold > summary, .ex-row > summary { padding-top:0; padding-bottom:0; }
.ex-row > summary { padding:12px 0; }
.day-card > summary { padding:14px 16px; }
.app-footer { max-width:760px; margin:8px auto 24px; padding:0 18px; color:var(--text-3); font-size:.8rem; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
}
@media print { .tabbar, .timer-bar, .app-header .icon-btn, .ob-nav { display:none; } body { padding:0; } .hero { color:#000; background:none; box-shadow:none; } }
</style>
</head>
<body>
<a class="skip" href="#main">Zum Inhalt springen</a>

    if (tooHard) return { kind: 'hold', weight: w, reps: [lo, hi], title: 'Gewicht halten', text: `Du warst näher am Versagen als geplant (Ziel RIR ${tRIR}). Bleib bei ${fmtKg(w)} und arbeite an sauberen Wiederholungen.` };

      text: `Bleib bei ${fmtKg(w)} und versuche +1 ${u} in den Sätzen unter ${hi} (${missing} ${missing === 1 ? 'Satz' : 'Sätze'}). Erst wenn alle Sätze ${hi} ${u} bei passendem RIR erreichen, steigt das Gewicht.` };

    const reachedExt = sets.every(s => Number(s.reps) >= extHi);
    const why = ex.loadType === 'dumbbell' ? `Du nutzt bereits die schwerste Kurzhantel (${fmtKg(loadCapOf(ex, eq))}).`
      : ex.loadType === 'bodyweight' ? 'Körpergewichtsübung ohne aktivierte Zusatzlast.'

      text: `${why} ${reachedExt ? 'Den erweiterten Bereich schaffst du schon – nächste Schritte in dieser Reihenfolge:' : `Nächster Schritt: bis ${extHi} ${u} pro Satz steigern.`}`,

  const jump = base > 0 ? (next - w) / base : 1;

    const bridge = Math.min(30, hi + clamp(Math.round(hi * jump / 2), 2, 10));
    if (!sets.every(s => Number(s.reps) >= bridge)) {
      return { kind: 'bridge', weight: w, reps: [hi, bridge], title: 'Erst Wiederholungen, dann Gewicht',
        text: `Der nächste Sprung (${fmtKg(w)} → ${fmtKg(next)}) wäre +${Math.round(jump * 100)} % – mehr als ca. 10 %. Steigere zuerst auf ${bridge} ${u} in allen Sätzen, dann erhöhe das Gewicht.`, next };
    }

    text: `Alle Sätze am oberen Ende (${hi} ${u}) bei passendem RIR → ${fmtKg(next)} (+${fmtKg(Math.round((next - w) * 100) / 100)}). Starte wieder bei ${lo} ${u}.` };

  for (const [p, r] of [[0.5, 8], [0.7, 5], [0.85, 3]]) {

/* =====================================================================
   LOGIC · Ernährung (Mifflin-St-Jeor)
   ===================================================================== */
const ACTIVITY = [
  { v: 1.2,   label: 'Überwiegend sitzend, kaum Bewegung' },
  { v: 1.375, label: 'Leicht aktiv (1–3 Trainingseinheiten/Woche)' },
  { v: 1.55,  label: 'Mäßig aktiv (3–5 Einheiten/Woche)' },
  { v: 1.725, label: 'Sehr aktiv (6–7 Einheiten/Woche)' },
  { v: 1.9,   label: 'Extrem aktiv (körperliche Arbeit + Training)' }
];
function mifflin(sex, kg, cm, age) {
  const base = 10 * kg + 6.25 * cm - 5 * age;
  return sex === 'm' ? base + 5 : sex === 'f' ? base - 161 : base - 78; // divers/keine Angabe: Mittelwert
}
function suggestActivity(profile) {
  const n = (Number(profile.days) || 0) + sportUnits(profile.extraSport);
  return n <= 1 ? 1.2 : n <= 3 ? 1.375 : n <= 5 ? 1.55 : n <= 7 ? 1.725 : 1.9;
}
function defaultSurplus(exp) { return exp === 'advanced' ? 5 : exp === 'intermediate' ? 7.5 : 10; }
function nutritionCalc(p, s) {
  const kg = Number(p.weightKg), cm = Number(p.heightCm), age = Number(p.age);
  if (!(kg > 30) || !(cm > 100) || !(age >= 14)) return null;
  const bmr = mifflin(p.sex, kg, cm, age);
  const tdee = bmr * s.activity;
  const kcal = tdee * (1 + s.surplusPct / 100);
  const protein = s.proteinGkg * kg;
  const fat = Math.max(0.6, s.fatGkg) * kg;
  const carbs = Math.max(0, (kcal - protein * 4 - fat * 9) / 4);
  const fatPct = (fat * 9) / kcal;
  return { bmr, tdee, kcal, surplus: kcal - tdee, protein, proteinRange: [1.6 * kg, 2.2 * kg], perMeal: [0.3 * kg, 0.4 * kg],
    fat, fatPct, carbs, ffm: p.bodyFatPct ? kg * (1 - Number(p.bodyFatPct) / 100) : null };
}

/* =====================================================================
   LOGIC · Selbsttest (Abnahmekriterien 2–8) – Ausgabe in der Konsole
   ===================================================================== */
function checkPlan(plan, profile, eq, checkVolume, errors, label) {
  const inj = profile.injuries || [];
  const err = msg => errors.push(`${label}: ${msg}`);
  plan.weeks.forEach((wk, wi) => {
    wk.days.forEach((d, di) => {
      if (d.entries.length < 3) err(`W${wi + 1} T${di + 1} hat nur ${d.entries.length} Übungen`);
      let seenIso = false;
      d.entries.forEach(e => {
        const ex = EX[e.exId];
        if (!ex) { err(`unbekannte Übung ${e.exId}`); return; }
        if (!isExerciseAvailable(ex, eq)) err(`${ex.id} mit aktivem Equipment nicht durchführbar`);
        if (ex.needsCableAdjustable && !eq.cableAdjustable) err(`${ex.id} braucht verstellbaren Kabelzug`);
        if (ex.needsSpotter && !eq.spotterAvailable) { err(`${ex.id} ohne Spotter automatisch eingeplant`); if (e.rir < 3) err(`${ex.id} ohne Spotter mit RIR ${e.rir}`); }
        if (ex.failureRisk && e.rir < 1) err(`${ex.id} mit RIR 0 geplant`);
        if (/squat-bb|front-squat/.test(ex.id) && e.rir < 2) err(`${ex.id} mit RIR ${e.rir} (< 2) geplant`);
        if (!ex.countsToVolume) err(`Kettlebell/Prävention ${ex.id} im Hauptteil`);
        if (isContraindicated(ex, inj)) err(`${ex.id} trotz Einschränkung ${ex.contraindications.join('/')} eingeplant`);
        if (ex.category === 'compound' && seenIso) err(`W${wi + 1} T${di + 1}: Grundübung ${ex.id} nach Isolationsübung`);
        if (ex.category !== 'compound') seenIso = true;
        if (!wk.deload) {
          if (ex.category === 'compound' && (e.rir < 1 || e.rir > 3)) err(`${ex.id} RIR ${e.rir} außerhalb 1–3`);
          if (ex.category !== 'compound' && (e.rir < 0 || e.rir > (ex.minRIR > 2 ? ex.minRIR : 2))) err(`${ex.id} RIR ${e.rir} außerhalb 0–2`);
        } else if (e.rir < 3) err(`Deload ${ex.id} RIR ${e.rir} < 3`);
        if (ex.unit === 'reps' && ex.loadType !== 'bodyweight') {
          const [lo, hi] = e.repRange;
          if (ex.category === 'compound' && (lo < 5 || hi > 12 || (hi > 10 && !['dumbbell','cable'].includes(ex.loadType)))) err(`${ex.id} Wdh.-Bereich ${lo}–${hi} unpassend für Grundübung`);
          if (ex.category === 'isolation' && (lo < 8 || hi > 15)) err(`${ex.id} Wdh.-Bereich ${lo}–${hi} unpassend für Isolation`);
        }
        const rest = e.restSec;
        if (ex.category === 'compound' && (rest[0] < 90 || rest[1] > 180)) err(`${ex.id} Pause ${rest.join('–')} s`);
      });
      if (!wk.deload && plan.sessionMin < 999 && d.entries.length > 3 && dayMinutes(d) > plan.sessionMin + 0.5) err(`W${wi + 1} T${di + 1} überschreitet Zeitbudget (${Math.round(dayMinutes(d))} > ${plan.sessionMin} Min)`);
      // Aufwärmen & Cooldown: vollständig, passend zum Tag, Equipment und Einschränkungen
      const wu = d.warmup || [], cd = d.cooldown || [], tag = `W${wi + 1} T${di + 1}`;
      if (!(d.warmMin > 0) || !(d.coolMin > 0)) err(`${tag}: Zeit für Aufwärmen/Cooldown fehlt im Zeitbudget`);
      if (!wu.some(x => x.phase === 'pulse') || !wu.some(x => x.phase === 'mobility') || !wu.some(x => x.phase === 'sets')) err(`${tag}: Aufwärmen unvollständig`);
      wu.forEach(x => {
        const src = x.phase === 'pulse' ? (x.id === 'pulse-jump' ? PULSE.jump : PULSE.soft) : x.phase === 'mobility' ? MOB[x.id] : x.phase === 'activation' ? ACT[x.id] : null;
        if (['pulse', 'mobility', 'activation'].includes(x.phase) && !wcAllowed(src, eq, inj)) err(`${tag}: Aufwärmbaustein ${x.id} trotz Einschränkung/fehlendem Equipment`);
        if (x.phase === 'sets' && !d.entries.some(e => e.exId === x.exId)) err(`${tag}: Aufwärmsätze für ${x.exId}, die nicht im Tag ist`);
      });
      if (!cd.some(x => x.phase === 'calm') || !cd.some(x => x.phase === 'stretch')) err(`${tag}: Cooldown ohne Dehnung`);
      const trained = new Set(d.entries.flatMap(e => Object.keys(contrib(EX[e.exId]))));
      cd.filter(x => x.phase === 'stretch').forEach(x => {
        const s = STR[x.id];
        if (!s) { err(`${tag}: unbekannte Dehnung ${x.id}`); return; }
        if (!s.fallback && !s.muscles.some(m => trained.has(m))) err(`${tag}: Dehnung ${x.id} passt nicht zu den trainierten Muskeln`);
        if (!wcAllowed(s, eq, inj)) err(`${tag}: Dehnung ${x.id} trotz Einschränkung/fehlendem Equipment`);
      });
    });
    // 48-h-Regel
    TRACKED.forEach(m => {
      const days = muscleDays(wk, m);
      for (let i = 0; i < days.length; i++) for (let j = i + 1; j < days.length; j++)
        if (circDist(wk.days[days[i]].weekday, wk.days[days[j]].weekday) < 2) err(`W${wi + 1}: ${m} an Tagen ${days[i] + 1}/${days[j] + 1} ohne 48 h Pause`);
    });
    // Kettlebells zählen nie
    const v2 = computeVolume([{ entries: [{ exId: 'kb-swing', sets: 5 }, { exId: 'kb-goblet', sets: 5 }] }]);
    if (TRACKED.some(m => v2[m] !== 0)) err('Kettlebell-Übungen fließen ins Volumen ein');
    if (checkVolume && !wk.deload) {
      TRACKED.forEach(m => {
        const v = wk.volume[m], [lo, hi] = plan.corridor[m];
        if (v < lo - 1e-9 || v > hi + 1e-9) err(`W${wi + 1}: ${m} Volumen ${v} außerhalb Korridor ${lo}–${hi}`);
      });
    }
  });
  const last = plan.weeks[plan.weeks.length - 2], dl = plan.weeks[plan.weeks.length - 1];
  const tot = w => TRACKED.reduce((a, m) => a + w.volume[m], 0);
  const ratio = tot(dl) / tot(last);
  if (ratio < 0.4 || ratio > 0.7) err(`Deload-Volumen ${Math.round(ratio * 100)} % statt ~50 %`);
}

function testProgression(errors) {

  const injs = full ? [[], ['knee'], ['lower_back']] : [[], ['knee']];
  for (const c of configs) for (const exp of exps) for (const sch of schedules) for (const inj of injs) for (const time of [60, 999]) {

    const plan = generatePlan(profile, deepClone(base), { budgetOverride: time });

    const sd = sportDays(s), w0 = plan.weeks[0];

    const wds = w0.days.map(d => d.weekday);

    w0.days.forEach(d => { if (LEG_TYPES.includes(d.type) && legBlocked(d.weekday, sd)) E(`${label}: ${d.name} (${WEEKDAYS[d.weekday]}) vor dem Handball`); });
    // Sprungkraft: höchstens 2 Tage, nur an Bein-/Ganzkörpertagen, nie bei Knie-/Sprunggelenkbeschwerden
    const pDays = w0.days.filter(d => (d.power || []).length);
    if (pDays.length > 2) E(`${label}: Sprungkraft an ${pDays.length} Tagen`);
    if (pDays.some(d => !LEG_TYPES.includes(d.type))) E(`${label}: Sprungkraft an einem Oberkörpertag`);
    if (inj.includes('knee') && pDays.length) E(`${label}: Sprungkraft trotz Kniebeschwerden`);
    if (!inj.length && !pDays.length) E(`${label}: kein Sprungkraft-Block`);
    pDays.forEach(d => d.power.forEach(p => { if (!PW[p.id] || !powerAllowed(PW[p.id], base, inj)) E(`${label}: Sprung ${p.id} unzulässig`); }));
    // Bein-Grundübungen mit Langhantel: kraftorientiert und (bei hoher Belastung) RIR ≥ 2
    plan.weeks.filter(w => !w.deload).forEach(w => w.days.forEach(d => d.entries.forEach(e => {
      const ex = EX[e.exId];
      if (ex.category === 'compound' && regionOf(ex) === 'lower' && plan.rx.legsMinRIR && e.rir < plan.rx.legsMinRIR) E(`${label}: ${ex.id} mit RIR ${e.rir}`);
    })));
    if (errors.length > before + 20) errors.splice(before + 20);
  }
  // Feste Krafttage: genau diese Tage, Einheiten vor dem Handball ohne Beine, 48 h eingehalten (checkPlan)
  [[0, 2, 4], [0, 1, 2], [4, 5, 6], [0, 2, 4, 6], [0, 1, 4, 5], [0, 1, 2, 3, 4], [0, 1, 2, 4, 5, 6], [2, 5]].forEach(gym => [{ days: [1, 3], match: null }, { days: [1, 3], match: 5 }, { days: [], match: null }].forEach(sch => {
    const s = { type: sch.days.length ? 'handball' : 'none', days: sch.days, match: sch.match, intensity: 2, power: true, prevention: true };
    const profile = { experience: 'intermediate', days: gym.length, split3: 'fullbody', sessionMin: 999, mesoLength: 6, focus: [], injuries: [], dayMode: 'fixed', gymDays: gym, extraSport: s };
    const plan = generatePlan(profile, deepClone(base), { budgetOverride: 999 });
    const label = `[Feste Tage ${gym.map(i => WEEKDAYS[i]).join('/')}, Handball ${sch.days.map(i => WEEKDAYS[i]).join('/') || '–'}${sch.match != null ? ' Spiel ' + WEEKDAYS[sch.match] : ''}]`;
    const sd = sportDays(s), w0 = plan.weeks[0];
    if (w0.days.map(d => d.weekday).join() !== gym.join()) E(`${label}: Wochentage ${w0.days.map(d => WEEKDAYS[d.weekday]).join('/')} statt der gewählten`);
    w0.days.forEach(d => { if (LEG_TYPES.includes(d.type) && legBlocked(d.weekday, sd)) E(`${label}: ${d.name} am ${WEEKDAYS[d.weekday]} vor dem Handball`); });
    if (!w0.days.some(d => LEG_TYPES.includes(d.type)) && gym.some(g => !legBlocked(g, sd))) E(`${label}: kein Beintag, obwohl ein freier Tag gewählt ist`);

  }));
  // „Heute“: vor dem Handball eine Einheit ohne Beine, nach Beinen gestern keine Beine
  {
    const s = { type: 'handball', days: [1, 3], match: null, intensity: 2, power: true, prevention: true };
    const profile = { experience: 'intermediate', days: 3, split3: 'fullbody', sessionMin: 75, mesoLength: 6, focus: [], injuries: [], dayMode: 'flex', gymDays: [], extraSport: s };
    const plan = generatePlan(profile, deepClone(base), {}); plan.done = {}; plan.skipped = {};

    if (!types.some(t => !LEG_TYPES.includes(t))) E('Spontan mit Handball: keine Einheit ohne Beine im Plan');
    const mo = pickForToday(plan, profile, 0, new Set());
    if (LEG_TYPES.includes(plan.weeks[0].days[mo.day].type)) E('Heute (Mo, morgen Handball): Einheit mit Beinen gewählt');
    const fr = pickForToday(plan, profile, 4, new Set(['quads', 'hamstrings', 'glutes']));

  const p0 = { experience: 'intermediate', days: 4, sessionMin: 999, mesoLength: 6, focus: [], injuries: [], extraSport: { type: 'none' } };
  const p1 = Object.assign({}, p0, { extraSport: { type: 'handball', days: [1, 3], match: 5, intensity: 2 } });
  const t0 = computeTargets(p0, 6, 0).weeks[0], t1 = computeTargets(p1, 6, 0).weeks[0];
  if (!(t1.quads < t0.quads && t1.calves < t0.calves && t1.hamstrings < t0.hamstrings)) E('Beinvolumen wird bei Handball nicht reduziert');

  const plan = generatePlan(Object.assign({}, p1, { sessionMin: 60 }), deepClone(base), {});
  const d = plan.weeks[0].days.find(x => (x.power || []).length);
  if (!d) E('Testplan ohne Sprungkraft');
  else {
    const rx = { week: 0, L: 6, deload: false, strength: plan.rx, budget: 60 };
    if ((adaptDay(d, { regions: ['knee'], muscles: [] }, base, [], rx).day.power || []).length) E('Sprungkraft trotz Knie heute');
    const h = adaptDay(d, { home: true, regions: [], muscles: [] }, base, [], rx);
    if ((h.day.power || []).some(p => (PW[p.id].equipment || []).length)) E('Zuhause Sprung mit Equipment');
    if ((adaptDay(d, { regions: [], muscles: ['quads'] }, base, [], rx).day.power || []).length) E('Sprungkraft trotz ausgelassener Beine');
  }
}

/* Führt den Selbsttest aus. full=true prüft alle Kombinationen inkl. Zeitbudgets/Verletzungen/Spotter. */
function runSelfTest(opts = {}) {
  const level = opts.level || (opts.full ? 'full' : 'quick');
  const full = level === 'full', boot = level === 'boot';
  const errors = [];
  const t0 = Date.now();
  let plans = 0, timeWarnings = 0;
  const base = deepClone(EQUIPMENT_PROFILE);
  const exps = Object.keys(EXPERIENCE);
  const configs = [];
  [2, 3, 4, 5, 6].forEach(days => (days === 3 ? ['fullbody', 'ppl'] : [null]).forEach(split3 => configs.push({ days, split3 })));
  const injuriesSet = full ? [[], ['shoulder'], ['knee'], ['lower_back'], ['elbow'], ['wrist'], ['ankle'], ['shoulder','knee','lower_back']] : boot ? [[]] : [[], ['shoulder','knee']];
  const times = full ? [30, 45, 60, 90, 999] : boot ? [999] : [60, 999];
  const focusSet = full ? [[], ['hamstrings','calves'], ['glutes','delts_side']] : boot ? [[]] : [[], ['hamstrings','calves']];
  const spotters = full ? [false, true] : [false];
  for (const c of configs) for (const exp of exps) for (const time of times) for (const inj of injuriesSet) for (const spot of spotters) for (const focus of focusSet) {
    const profile = { experience: exp, days: c.days, split3: c.split3 || 'fullbody', sessionMin: time, mesoLength: 6, focus, injuries: inj, extraSport: { type: 'none' } };
    const eq = deepClone(base); eq.spotterAvailable = spot;
    const plan = generatePlan(profile, eq, { budgetOverride: time });
    plans++;
    // Volumenkorridor verbindlich prüfen bei ausreichendem Zeitbudget, ohne Verletzungen und bei ≥ 2×/Woche-Splits
    const checkVolume = time >= 999 && !inj.length && c.split3 !== 'ppl';
    const before = errors.length;
    checkPlan(plan, profile, eq, checkVolume, errors, `[${c.days} Tage${c.split3 ? '/' + c.split3 : ''}, ${exp}, ${time >= 999 ? '∞' : time} Min, Verl.: ${inj.join('+') || '–'}, Spotter: ${spot ? 'ja' : 'nein'}, Fokus: ${focus.join('+') || '–'}]`);
    if (errors.length > before + 30) errors.splice(before + 30);
    if (!checkVolume && plan.warnings.some(w => w.level === 'warn')) timeWarnings++;
  }
  // Mesozykluslängen 4–8
  [4, 5, 7, 8].forEach(L => {
    const profile = { experience: 'intermediate', days: 4, sessionMin: 999, mesoLength: L, focus: [], injuries: [], extraSport: { type: 'none' } };
    const plan = generatePlan(profile, deepClone(base), { budgetOverride: 999 });
    plans++;
    if (plan.weeks.length !== L || !plan.weeks[L - 1].deload) errors.push(`Mesozyklus ${L} Wochen: falsche Wochenzahl/Deload`);
    checkPlan(plan, profile, deepClone(base), true, errors, `[Meso ${L} Wochen]`);
  });
  testProgression(errors); testPlates(errors); testInjuryFilter(errors); testEquipmentOnly(errors);
  if (typeof testExportImport === 'function') testExportImport(errors);
  if (typeof testSyncMerge === 'function') testSyncMerge(errors);
  if (typeof testWarmCoolMigration === 'function') testWarmCoolMigration(errors);
  if (!boot && typeof testDayLimits === 'function') testDayLimits(errors);
  if (!boot) { testSport(errors, full); testTimeBudget(errors); }
  const res = { ok: errors.length === 0, plans, errors, timeWarnings, ms: Date.now() - t0, full, level };
  if (opts.log !== false && typeof console !== 'undefined') {
    if (res.ok) console.info(`[Muskelplan Selbsttest] ✓ ${plans} Pläne + Progression/Plattenrechner/Filter geprüft – 0 Fehler (${res.ms} ms, Stufe: ${level}).`);
    else { console.error(`[Muskelplan Selbsttest] ✗ ${errors.length} Fehler`); errors.slice(0, 50).forEach(e => console.error('  – ' + e)); }
  }
  return res;
}

/* =====================================================================
   STATE · Persistenz (localStorage), Export/Import
   ===================================================================== */
const STORE_KEY = 'muskelplan.v1';
const STATE_VERSION = 1;
function defaultSettings() {
  return { theme: 'system', sound: true, vibrate: true, wakeLock: true, lastExport: null, nutrition: null, restAdjust: 0 };
}
function defaultState() {
  return {
    version: STATE_VERSION, createdAt: new Date().toISOString(), disclaimerAccepted: false,
    profile: null, equipment: deepClone(EQUIPMENT_PROFILE), plan: null,
    logs: [], active: null, body: [], checkins: [], blocks: [],
    settings: defaultSettings(), onboardingDraft: null, dayLimits: null

}
function migrate(s) {
  const out = Object.assign(defaultState(), s);
  const eqIn = s.equipment || {};
  out.equipment = Object.assign(deepClone(EQUIPMENT_PROFILE), eqIn);
  out.equipment.items = Object.assign(deepClone(EQUIPMENT_PROFILE.items), eqIn.items || {});
  out.equipment.plates = Object.assign(deepClone(EQUIPMENT_PROFILE.plates), eqIn.plates || {});
  out.equipment.safetyArms = false; // fest: keine Sicherungsarme vorhanden
  out.settings = Object.assign(defaultSettings(), s.settings || {});
  ['logs', 'body', 'checkins', 'blocks'].forEach(k => { if (!Array.isArray(out[k])) out[k] = []; });
  if (out.plan && Array.isArray(out.plan.weeks) && out.plan.weeks.some(w => (w.days || []).some(d => !Array.isArray(d.cooldown)))) {
    try { const p = deepClone(out.plan); refreshWarmCool(p, out.profile, out.equipment); out.plan = p; }
    catch (e) { /* alter Plan bleibt unverändert nutzbar */ }
  }
  out.version = STATE_VERSION;
  return out;
}
let state = defaultState();
let storageState = { ok: true, warned: false, loadError: null, persisted: null };
function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); }
  catch (e) { storageState.ok = false; storageState.loadError = 'Der Browser blockiert den lokalen Speicher (z. B. privater Modus). Daten gehen beim Schließen verloren – nutze den Export.'; return defaultState(); }
  if (!raw) return defaultState();
  try {
    const s = JSON.parse(raw);
    if (!s || typeof s !== 'object' || Array.isArray(s)) throw new Error('Format');
    return migrate(s);
  } catch (e) {
    storageState.loadError = 'Gespeicherte Daten waren beschädigt und konnten nicht gelesen werden. Eine Kopie liegt unter „' + STORE_KEY + '.corrupt“. Die App startet leer.';
    try { localStorage.setItem(STORE_KEY + '.corrupt', raw); } catch (_) { /* ignorieren */ }
    return defaultState();
  }
}
let _saveTimer = null;
function persistLocal() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); storageState.ok = true; }
  catch (e) {
    storageState.ok = false;
    if (!storageState.warned && typeof toast === 'function') { storageState.warned = true; toast('Speichern fehlgeschlagen (Speicher voll oder blockiert). Bitte exportiere ein Backup.'); }
  }
}
function save(now) {
  clearTimeout(_saveTimer);
  const run = () => { _saveTimer = null; persistLocal(); syncChanged(); };
  if (now) run(); else _saveTimer = setTimeout(run, 250);
}
function exportPayload() {
  return { app: 'muskelplan', schema: STATE_VERSION, exportedAt: new Date().toISOString(), data: state };
}
function parseImport(text) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { throw new Error('Die Datei ist kein gültiges JSON.'); }
  const data = obj && obj.app === 'muskelplan' ? obj.data : obj;
  if (!data || typeof data !== 'object' || Array.isArray(data) || !('version' in data) || !('logs' in data)) throw new Error('Das ist keine Muskelplan-Sicherung.');
  if (data.version > STATE_VERSION) throw new Error('Die Sicherung stammt aus einer neueren App-Version.');
  return migrate(data);
}
function stableStringify(v) {
  if (Array.isArray(v)) return '[' + v.map(stableStringify).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stableStringify(v[k])).join(',') + '}';
  return JSON.stringify(v);
}
/* Selbsttest: Export/Import verlustfrei */

/* Selbsttest: Tagesform-Einschränkungen (Beschwerden ersetzen/weglassen, Muskelgruppe auslassen) */
function testDayLimits(errors) {
  const eq = deepClone(EQUIPMENT_PROFILE);
  const E = msg => errors.push('Tagesform: ' + msg);
  let squatSeen = false;
  [2, 3, 4, 5, 6].forEach(days => {
    const profile = { experience: 'intermediate', days, split3: 'fullbody', sessionMin: 60, mesoLength: 6, focus: [], injuries: [], extraSport: { type: 'none' } };
    const plan = generatePlan(profile, eq, {});
    plan.weeks[0].days.forEach((d, di) => {
      const rx = { week: 0, L: plan.mesoLength, deload: false, strength: false, budget: plan.sessionMin };
      const check = (limits, label) => {
        const r = adaptDay(d, limits, eq, [], rx), ids = r.day.entries.map(e => e.exId);
        if (new Set(ids).size !== ids.length) E(`${label}: doppelte Übung`);
        r.day.entries.forEach(e => {
          const ex = EX[e.exId];
          if (isContraindicated(ex, limits.regions)) E(`${label}: ${e.exId} trotz ${limits.regions.join('/')}`);
          if (ex.primary.some(m => limits.muscles.includes(m))) E(`${label}: ${e.exId} trotz ausgelassener Muskelgruppe`);
          if (!isExerciseAvailable(ex, r.eq)) E(`${label}: ${e.exId} ${limits.home ? 'zuhause ohne Equipment' : ''} nicht durchführbar`);
          if (limits.home && !rx.deload && e.rir > 2) E(`${label}: ${e.exId} zuhause mit RIR ${e.rir} (> 2)`);
          if (ex.needsSpotter && !eq.spotterAvailable) E(`${label}: ${e.exId} braucht Spotter`);
          if (e.superset && r.day.entries.filter(o => o.superset === e.superset).length !== 2) E(`${label}: Supersatz ohne Partner`);
        });
        if (r.day.estMin > Math.max(plan.sessionMin, d.estMin) + 1 && r.day.entries.some(e => e.sets > 2 && r.changes.some(c => c.kind === 'swap' && c.uid === e.uid))) E(`${label}: Zeitbudget überschritten (${r.day.estMin} Min)`);
        const cd = cooldownFor(r.day, r.eq, { injuries: r.injuries }, 60), wu = warmupFor(r.day, r.eq, { injuries: r.injuries }, 60);
        cd.filter(x => x.phase === 'stretch').forEach(x => { if (!wcAllowed(STR[x.id], r.eq, r.injuries)) E(`${label}: Dehnung ${x.id} trotz Beschwerde/ohne Equipment`); });
        if (wu.some(x => x.id === 'pulse-jump') && !wcAllowed(PULSE.jump, eq, r.injuries)) E(`${label}: Springen trotz Beschwerde`);
        wu.filter(x => ['mobility', 'activation'].includes(x.phase)).forEach(x => { if (!wcAllowed(MOB[x.id] || ACT[x.id], r.eq, r.injuries)) E(`${label}: Aufwärmen ${x.id} trotz Beschwerde/ohne Equipment`); });
        return r;
      };
      TODAY_REGIONS.forEach(reg => check({ regions: [reg], muscles: [] }, `${days} Tage T${di + 1} ${reg}`));
      // Zuhause ohne Equipment – allein und kombiniert mit jeder Beschwerde
      const h = check({ home: true, regions: [], muscles: [] }, `${days} Tage T${di + 1} zuhause`);
      if (h.day.entries.length < Math.min(3, d.entries.length)) E(`${days} Tage T${di + 1} zuhause: nur ${h.day.entries.length} Übungen`);
      TODAY_REGIONS.forEach(reg => check({ home: true, regions: [reg], muscles: [] }, `${days} Tage T${di + 1} zuhause+${reg}`));
      [...new Set(d.entries.flatMap(e => EX[e.exId].primary))].forEach(m => check({ regions: [], muscles: [m] }, `${days} Tage T${di + 1} ohne ${m}`));
      if (d.entries.some(e => e.exId === 'squat-bb')) {
        squatSeen = true;
        const ch = check({ regions: ['lower_back'], muscles: [] }, 'Kniebeuge/unterer Rücken').changes.find(c => c.from === 'squat-bb');
        if (!ch || ch.kind !== 'swap' || !EX[ch.to].primary.includes('quads')) E('Kniebeuge bei Rückenbeschwerden nicht durch Quadrizeps-Alternative ersetzt');
      }
    });
  });
  if (!squatSeen) E('Testfall Kniebeuge nicht gefunden');
  // Heimübungen: nur im Heim-Modus verfügbar, Muster-Verweise gültig, keine Langhantel-Stufe in der Progression
  EXERCISES.filter(x => x.home).forEach(x => {
    if (isExerciseAvailable(x, eq)) E(`${x.id}: Heimübung im Kraftraum-Plan verfügbar`);
    if (!isExerciseAvailable(x, HOME_EQUIPMENT)) E(`${x.id}: Heimübung zuhause nicht verfügbar`);

  const pr = suggestProgression('bulgarian-bw', { repRange: [8, 20], rir: 1, sets: 3 }, [{ sets: [{ w: 0, reps: 20, rir: 1 }, { w: 0, reps: 20, rir: 1 }, { w: 0, reps: 20, rir: 1 }] }], HOME_EQUIPMENT, { bodyKg: 80 });
  if (pr.kind !== 'cap' || pr.steps.some(x => x.key === 'barbell' || x.key === 'weight')) E('Heim-Progression schlägt Langhantel/Zusatzlast vor');
}
/* Selbsttest: Pläne aus älteren Versionen bekommen Aufwärmen & Cooldown nachgerüstet (idempotent) */
function testWarmCoolMigration(errors) {
  const s = defaultState();
  s.profile = { experience: 'beginner', days: 2, sessionMin: 45, mesoLength: 4, focus: [], injuries: ['knee'], extraSport: { type: 'none' } };
  s.plan = generatePlan(s.profile, s.equipment, {});

/* Welche offene Einheit der aktuellen Woche passt heute am besten?
   Kriterien: keine Beine/Ganzkörper am Tag vor dem Handball (bzw. Spiel), möglichst nicht am Handball-Tag selbst,
   keine Muskeln, die in den letzten 48 h belastet wurden, an freien Tagen bevorzugt Beine (Oberkörper bleibt für die
   Tage vor dem Handball), sonst die Reihenfolge des Plans. */
function pickForToday(plan, profile, wd, recent) {
  const nx = nextSession(plan);
  if (!nx) return null;
  const wk = plan.weeks[nx.week], sd = sportDays(profile && profile.extraSport);
  const blocked = legBlocked(wd, sd), same = sd.train.includes(wd), sport = hasSportDays(sd);
  const open = wk.days.map((d, i) => ({ d, i })).filter(o => !plan.done[sessionKey(nx.week, o.i)] && !(plan.skipped || {})[sessionKey(nx.week, o.i)]);
  const legOpen = open.some(o => LEG_TYPES.includes(o.d.type)), upOpen = open.some(o => !LEG_TYPES.includes(o.d.type));
  const overlap = o => [...new Set(o.d.entries.flatMap(e => (EX[e.exId] ? EX[e.exId].primary : [])))].filter(m => recent.has(m) && MUSCLES[m] && MUSCLES[m].f != null);
  const score = o => {
    const leg = LEG_TYPES.includes(o.d.type);
    let sc = o.i * 0.1;
    if (leg && blocked) sc += 100;
    if (leg && same) sc += 20;
    if (overlap(o).length) sc += 30;
    if (sport && !leg && legOpen && !blocked && !same) sc += 5;
    return sc;
  };
  const best = open.slice().sort((a, b) => score(a) - score(b))[0];
  const first = open.find(o => o.i === nx.day) || open[0];
  let reason = '';
  if (best.i !== first.i) {
    const name = profile && hasSport(profile.extraSport) ? SPORTS[profile.extraSport.type].name : 'Sport';
    if (LEG_TYPES.includes(first.d.type) && blocked) reason = `${sd.match === (wd + 1) % 7 ? 'Morgen ist Spiel' : `Morgen ist ${name}`} – deshalb heute ${best.d.name} statt Beine.`;
    else if (LEG_TYPES.includes(first.d.type) && same) reason = `Heute ist auch ${name} – deshalb ${best.d.name} statt Beine.`;
    else if (overlap(first).length && !overlap(best).length) reason = `${muscleList(overlap(first))} ${overlap(first).length === 1 ? 'braucht' : 'brauchen'} noch Erholung – heute passt ${best.d.name}.`;
    else if (sport) reason = `Heute ist ein guter Tag für ${best.d.name} – der Oberkörper passt besser vor dem ${name}.`;
  }
  return { week: nx.week, day: best.i, auto: best.i !== nx.day, reason, legWarn: LEG_TYPES.includes(best.d.type) && blocked, upOpen };
}
/* In den letzten 48 h belastete Hauptmuskeln */
function recentMuscles(hours = 48) {
  const set = new Set();

    .forEach(l => l.exercises.forEach(x => { if (x.sets.length && EX[x.exId]) EX[x.exId].primary.forEach(m => set.add(m)); }));
  return set;
}
/* Welche Einheit zeigt „Heute“? Die von dir gewählte – sonst die, die heute am besten passt */

    if (plan.weeks[w] && plan.weeks[w].days[d] && !plan.done[sessionKey(w, d)]) return { week: w, day: d, picked: true };
    ui.todayPick = null;

function restHint(day) {

  if (hours >= 48) return '';

  last.exercises.forEach(x => { if (x.sets.length && EX[x.exId]) EX[x.exId].primary.forEach(m => lastM.add(m)); });

  if (!overlap.length) return '';

function completeSet(i, j) {

  if (!(reps > 0) || !Number.isInteger(reps) || reps > 500) { toast(`Bitte gültige ${unitLabel(ex)} eintragen.`); focusInput(i, j, 'reps'); return; }
  if (showWeightInput(ex)) {
    const w = parseNum(st.w);
    if (isNaN(w) || w < 0 || w > 500) { toast('Bitte ein gültiges Gewicht eintragen (0–500 kg).'); focusInput(i, j, 'w'); return; }

  const bw = bodyWeight();
  const e1 = setE1RM(ex, st, bw);
  const prevBest = bestE1RM(x.exId, a.id);
  const sessBest = Math.max(0, ...x.sets.filter((o, k) => k !== j && o.done).map(o => setE1RM(ex, o, bw) || 0));
  st.pr = !!(e1 && prevBest && e1 > prevBest + 1e-6 && e1 > sessBest);
  if (st.pr) toast(`🏆 Neuer Rekord: ${ex.name} – geschätztes Maximalgewicht ${fmtKg(Math.round(e1 * 10) / 10)}`);
  // nächsten Satz vorbelegen
  const nxt = x.sets[j + 1];
  if (nxt && !nxt.done && (nxt.w === '' || nxt.w == null)) nxt.w = st.w;
  ensureAudio();
  // Pausentimer (bei Supersatz erst nach dem zweiten Partner)
  const partnerIdx = x.planned.superset ? a.exercises.findIndex((o, k) => k !== i && o.planned.superset === x.planned.superset) : -1;

function volumeBars(vol, target, corridor, focus, deload) {
  const scale = Math.max(...TRACKED.map(m => Math.max(corridor[m][1], vol[m], target[m]))) + 1;
  const pct = v => Math.max(0, Math.min(100, v / scale * 100));
  const rows = TRACKED.map(m => {
    const v = vol[m], [lo, hi] = corridor[m], t = target[m];
    const cls = deload ? '' : v > hi + 1e-9 ? 'high' : '';
    const status = deload ? 'Erholungswoche' : v > hi + 1e-9 ? 'mehr als nötig' : 'geplant';
    return `<div class="vol-row" role="listitem" aria-label="${esc(MUSCLES[m].name)}: ${fmt(v, 1)} Sätze, Ziel ${fmt(t, 1)}, sinnvoll ${fmt(lo, 1)} bis ${fmt(hi, 1)}, ${status}">
      <span>${esc(MUSCLES[m].short)}${focus.includes(m) ? ' ★' : ''}</span>
      <span class="vol-track" aria-hidden="true"><span class="vol-band" style="left:${pct(lo)}%;width:${pct(hi) - pct(lo)}%"></span><span class="vol-fill ${cls}" style="width:${pct(v)}%"></span><span class="vol-target" style="left:${pct(t)}%"></span></span>
      <span class="tnum small" style="text-align:right">${fmt(v, 1)}<span class="muted">/${fmt(t, 1)}</span></span></div>`;
  }).join('');
  return `<div role="list">${rows}</div><div class="vol-legend"><span><i style="background:var(--band)"></i>sinnvoller Bereich</span><span><i style="background:var(--accent)"></i>geplant</span><span><i style="background:var(--text);width:3px"></i>Ziel dieser Woche</span><span>★ Schwerpunkt</span></div>`;
}
/* Übung im Plan (alle Wochen) ersetzen */
function applyPlanSwap(uid, newId) {

    wk.days.forEach(d => d.entries.forEach(e => {
      if (e.uid !== uid) return;
      e.exId = newId;
      const ex = EX[newId];
      e.repRange = repRangeFor(ex, planRx(plan)); e.restSec = restFor(ex, d.compact);
      e.rir = computeRIR(ex, wk.index, plan.mesoLength, wk.deload, state.equipment, planRx(plan));
      if (ex.category === 'compound' || ex.unilateral || ex.unit === 's') { if (e.superset) d.entries.forEach(o => { if (o.superset === e.superset) o.superset = null; }); }
    }));
    wk.days.forEach(d => { sortEntries(d); attachWarmCool(d, state.equipment, state.profile, Number(plan.sessionMin) || 60); d.estMin = Math.round(dayMinutes(d)); });
    wk.volume = computeVolume(wk.days);
  });
  plan.swaps = plan.swaps || {}; plan.swaps[uid] = newId;
}

function doSwap(newId) {

  let g = '';
  for (let i = 0; i <= 4; i++) { const v = y0 + (y1 - y0) * i / 4, y = Y(v); g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end">${fmt(v, 1)}</text>`; }
  const lbl = t => fmtDate(t, { day: '2-digit', month: '2-digit' });

  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const dots = pts.map(p => `<circle class="pt" cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4"><title>${lbl(p.t)}: ${fmt(p.v, 1)} ${esc(o.unit || '')}</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'Verlauf')}">${g}<path class="line" d="${d}"/>${dots}</svg>
    <details><summary class="small">Datentabelle</summary><div class="table-wrap"><table><thead><tr><th>Datum</th><th class="r">${esc(o.unit || 'Wert')}</th></tr></thead><tbody>${pts.map(p => `<tr><td>${fmtDate(p.t)}</td><td class="r">${fmt(p.v, 1)}</td></tr>`).join('')}</tbody></table></div></details>`;
}
function barChart(items, o = {}) {
  const W = 640, H = o.h || 200, pl = 34, pr = 10, pt = 12, pb = 30;
  const maxV = Math.max(1, ...items.map(i => i.v), o.band ? o.band[1] : 0) * 1.1;
  const Y = v => pt + (1 - v / maxV) * (H - pt - pb);
  const bw = (W - pl - pr) / items.length;
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = maxV * i / 4, y = Y(v); g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/><text x="${pl - 5}" y="${y + 4}" text-anchor="end">${fmt(v, 0)}</text>`; }
  if (o.band) g += `<rect class="band" x="${pl}" width="${W - pl - pr}" y="${Y(o.band[1])}" height="${Y(o.band[0]) - Y(o.band[1])}"/>`;
  items.forEach((it, i) => {
    const x = pl + i * bw + bw * 0.18, w = bw * 0.64, y = Y(it.v);
    g += `<rect class="bar" x="${x}" y="${y}" width="${w}" height="${Math.max(0, H - pb - y)}" rx="3"><title>${esc(it.label)}: ${fmt(it.v, 1)}</title></rect><text x="${x + w / 2}" y="${H - 10}" text-anchor="middle">${esc(it.label)}</text>`;
  });

}
function heatmap(weeks = 16) {
  const counts = {};
  state.logs.forEach(l => { const k = localDay(l.date); counts[k] = (counts[k] || 0) + 1; });
  const start = mondayOf(new Date()); start.setDate(start.getDate() - (weeks - 1) * 7);
  const c = 16, gap = 3, W = 34 + weeks * (c + gap), H = 7 * (c + gap) + 20;
  let g = '';
  ['Mo', 'Mi', 'Fr'].forEach((l, i) => { g += `<text x="0" y="${(i * 2) * (c + gap) + c - 3}">${l}</text>`; });
  let total = 0;
  for (let w = 0; w < weeks; w++) for (let d = 0; d < 7; d++) {
    const dt = new Date(start); dt.setDate(start.getDate() + w * 7 + d);
    const iso = new Date(dt.getTime() - dt.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
    const n = counts[iso] || 0; total += n;
    const future = dt > new Date();
    g += `<rect x="${34 + w * (c + gap)}" y="${d * (c + gap)}" width="${c}" height="${c}" rx="3" fill="${future ? 'transparent' : n ? 'var(--accent)' : 'var(--surface-3)'}" opacity="${n > 1 ? 1 : n ? 0.75 : 1}"><title>${fmtDate(dt)}: ${n} Einheit(en)</title></rect>`;
  }
  return `<svg class="chart heat" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trainingskalender der letzten ${weeks} Wochen: ${total} Einheiten">${g}</svg>`;
}
function loggedVolume(logs) {
  const v = zeroVol();

}
function viewProgress() {

    const total = plan.weeks.reduce((a, w) => a + w.days.length, 0);

  if (!ui.progEx || !exIds.includes(ui.progEx)) ui.progEx = exIds[0] || null;
  const e1pts = ui.progEx ? logs.map(l => { const x = l.exercises.find(e => e.exId === ui.progEx); if (!x) return null; const v = Math.max(0, ...x.sets.map(s => setE1RM(EX[ui.progEx], s, bw) || 0)); return v ? { t: new Date(l.date).getTime(), v: Math.round(v * 10) / 10 } : null; }).filter(Boolean) : [];
  // Wochenvolumen je Muskel (8 Kalenderwochen)
  const m = ui.progMuscle;
  const mon = mondayOf(new Date());
