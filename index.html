function isoWeek(d) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); }
function evaluationCard(plan) {
  const nx = nextSession(plan);
  let w = nx ? nx.week : plan.weeks.length - 1;
  let logs = blockLogs(plan).filter(l => l.week === w);
  if (!logs.length && w > 0) { w -= 1; logs = blockLogs(plan).filter(l => l.week === w); }
  if (!logs.length) return '';
  const wk = plan.weeks[w];
  const complete = wk.days.every((d, i) => plan.done[sessionKey(w, i)] || (plan.skipped || {})[sessionKey(w, i)]);
  const running = !complete;
  const vol = loggedVolume(logs);
  const lines = TRACKED.map(m => {
    const got = vol[m], want = wk.volume[m];
    const ok = got >= want - 0.25;
    return `<li><strong>${esc(MUSCLES[m].short)}:</strong> ${fmt(got, 1)} von ${fmt(want, 1)} Zielsätzen ${ok ? 'erreicht ✓' : ''}</li>`;
  }).join('');
  return `<details class="card fold" data-details="evalOpen" ${ui.evalOpen ? 'open' : ''}><summary><div><h2>Woche ${w + 1}${running ? ' (läuft)' : ''}</h2><div class="card-sub">${logs.length} von ${wk.days.length} Einheiten erledigt · Sätze pro Muskel</div></div>${icon('chev', 'chev')}</summary><div class="fold-body"><ul class="list">${lines}</ul></div></details>`;
}

function parseList(txt) {
  const vals = String(txt).replace(/,\s+/g, ';').split(/[;\s]+/).map(v => parseNum(v)).filter(v => !isNaN(v));
  return [...new Set(vals)].sort((a, b) => a - b);
}
function setEq(path, el) {
  const eq = state.equipment;
  const parts = path.split('.');
  if (parts[0] === 'items') { eq.items[parts[1]] = el.checked; }
  else if (parts[0] === 'plates') {
    const n = parseNum(el.value);
    if (!Number.isInteger(n) || n < 0 || n > 40) { el.setAttribute('aria-invalid', 'true'); toast('Scheiben: bitte eine ganze Zahl zwischen 0 und 40.'); return false; }
    eq.plates[parts[1]] = n;
  } else if (['barbellKg', 'lightBarbellKg', 'ezBarKg', 'cableStepKg'].includes(path)) {
    const n = parseNum(el.value);
    if (!(n > 0) || n > 60) { el.setAttribute('aria-invalid', 'true'); toast('Bitte einen Wert zwischen 0 und 60 kg eingeben.'); return false; }
    eq[path] = n;
  } else if (path === 'cableMaxKg') {
    const n = parseNum(el.value);
    if (el.value.trim() === '') eq.cableMaxKg = null;
    else if (!(n > 0) || n > 400) { el.setAttribute('aria-invalid', 'true'); toast('Ungültiges Maximalgewicht.'); return false; }
    else eq.cableMaxKg = n;
  } else if (path === 'dumbbellStepsKg' || path === 'kettlebellsKg') {
    const list = parseList(el.value).filter(v => v > 0 && v <= 100);
    if (!list.length) { el.setAttribute('aria-invalid', 'true'); toast('Bitte mindestens ein Gewicht angeben, z. B. „2,5; 5; 7,5“.'); return false; }
    eq[path] = list;
  } else if (['spotterAvailable', 'cableAdjustable', 'highPulleyStanding', 'improvisedWeightedBodyweight'].includes(path)) {
    eq[path] = el.checked;
  }
  el.removeAttribute('aria-invalid');
  _sideCache.clear();
  return true;
}

function earlyDeload() {
  const plan = state.plan;
  if (!plan) return;
  const dl = plan.weeks.length - 1;
  const nx = nextSession(plan);
  if (nx && nx.week === dl) { toast('Du bist bereits in der Erholungswoche.'); return; }
  confirmDialog({ title: 'Erholungswoche vorziehen?', text: 'Die restlichen Aufbau-Einheiten dieses Blocks werden übersprungen, als Nächstes folgt die Erholungswoche (etwa halbe Sätze, ca. 90 % Gewicht, mehr Luft nach oben).', ok: 'Erholungswoche starten' }).then(ok => {
    if (!ok) return;
    plan.skipped = plan.skipped || {};
    for (let w = 0; w < dl; w++) plan.weeks[w].days.forEach((d, i) => { const k = sessionKey(w, i); if (!plan.done[k]) plan.skipped[k] = true; });
    plan.earlyDeload = true; ui.planWeek = dl;
    save(); render(); toast('Die Erholungswoche ist jetzt dran.');
  });
}
function newBlock() {
  const plan = state.plan;
  if (!plan) return;
  if (state.active) { toast('Bitte beende zuerst das laufende Training.'); return; }
  const a = blockAdaptation(plan);
  const nx = nextSession(plan);
  const adj = clamp((plan.volumeAdjust || 0) + a.adj, -2, 3);
  confirmDialog({ title: 'Neuen Block starten?', text: `${nx ? 'Der aktuelle Block ist noch nicht abgeschlossen. ' : ''}${a.text} Kernübungen bleiben, ein Teil der Nebenübungen rotiert.`, ok: 'Neuen Block starten' }).then(ok => {
    if (!ok) return;
    const b = state.blocks.find(x => x.planId === plan.id);
    if (b) { b.endedAt = new Date().toISOString(); b.adherencePct = a.adherencePct; }
    createNewPlan(plan.blockIndex + 1, adj, plan.swaps || {});
    save(true); go('plan'); render(); toast(`Block ${state.plan.blockIndex + 1} gestartet.`);
  });
}
function regenPlan() {
  if (!state.profile) { ui.onboarding = restoreOnboarding(); render(); return; }
  if (state.active) { toast('Bitte beende zuerst das laufende Training.'); return; }
  const doIt = () => { createNewPlan(state.plan ? state.plan.blockIndex : 0, state.plan ? state.plan.volumeAdjust || 0 : 0, {}, true); save(true); go('plan'); render(); toast('Plan neu erstellt.'); };
  if (state.plan) confirmDialog({ title: 'Plan neu erstellen?', text: 'Der Plan wird mit deinem aktuellen Profil und Equipment neu berechnet. Der Fortschritt im aktuellen Block (erledigte Einheiten) wird zurückgesetzt, deine Logs bleiben erhalten.', ok: 'Neu erstellen', danger: true }).then(ok => { if (ok) doIt(); });
  else doIt();
}
function runSelfTestUI(level) {
  ui.selfTestRunning = true; render();
  setTimeout(() => {
    try { ui.selfTest = runSelfTest({ level }); }
    catch (e) { ui.selfTest = { ok: false, errors: ['Selbsttest abgebrochen: ' + e.message], plans: 0, ms: 0, timeWarnings: 0, level }; console.error(e); }
    ui.selfTestRunning = false; render();
  }, 60);
}
function doExport() {
  try {
    const blob = new Blob([JSON.stringify(exportPayload(), null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `muskelplan-backup-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    state.settings.lastExport = new Date().toISOString(); save(); render();
    toast('Backup exportiert.');
  } catch (e) { toast('Export fehlgeschlagen: ' + e.message); }
}
function doImportFile(file) {
  const r = new FileReader();
  r.onload = () => {
    let next;
    try { next = parseImport(String(r.result)); }
    catch (e) { openDialog(`${closeBtn()}<h2 id="dlgTitle">Import fehlgeschlagen</h2><p>${esc(e.message)}</p><div class="dlg-actions"><button type="button" class="btn primary" data-action="dlg-close">OK</button></div>`); return; }
    confirmDialog({ title: 'Backup importieren?', text: `Die Sicherung enthält ${next.logs.length} Trainingslogs${next.plan ? ' und einen Plan' : ''}. Deine aktuellen Daten in diesem Browser werden dabei vollständig ersetzt.`, ok: 'Importieren', danger: true }).then(ok => {
      if (!ok) return;
      state = next; stopTimer(); releaseWakeLock(); ui.onboarding = null; storageState.loadError = null;
      save(true); render(); toast('Backup importiert.');
    });
  };
  r.onerror = () => toast('Datei konnte nicht gelesen werden.');
  r.readAsText(file);
}

function onChange(e) {
  const el = e.target;
  const ob = ui.onboarding;
  if (el.id === 'importFile' && el.files && el.files[0]) { doImportFile(el.files[0]); return; }
  if (el.id === 'pickSess' && el.value) { ui.todayPick = el.value; render(); return; } // erst anzeigen, Start per Knopf
  if (el.id === 'pcBar') { updatePlates(); return; }
  if (ob) {
    const d = ob.data;
    if (el.dataset.ob) {
      const k = el.dataset.ob;
      if (k === 'accepted') ob.accepted = el.checked;
      else if (el.type === 'checkbox') d[k] = el.checked;
      else if (['days', 'sessionMin', 'mesoLength'].includes(k)) d[k] = Number(el.value);
      else d[k] = el.value;
      if (k === 'dayMode' && el.value === 'fixed' && !(d.gymDays || []).length) d.gymDays = previewWeek(Object.assign({}, d, { dayMode: 'flex' })).days.map(x => x.weekday); // Vorschlag als Start
      if (['days', 'sessionMin', 'experience', 'split3', 'mesoLength', 'dayMode'].includes(k) || k === 'accepted') { ob.error = null; state.onboardingDraft = ob; save(); render(); return; }
    } else if (el.dataset.obParqAny) {
      // Gesundheitscheck mit einer Antwort: „keiner“ = alle Fragen mit Nein beantwortet
      d.parq.any = el.value === 'yes';
      d.parq.answers = d.parq.any ? d.parq.answers.map(a => (a === false ? null : a)) : PARQ.map(() => false);
      ob.error = null; render();
    } else if (el.dataset.obSday != null) {
      const s = d.extraSport, i = Number(el.dataset.obSday), set = new Set((s.days || []).map(Number));
      if (el.checked) set.add(i); else set.delete(i);
      s.days = [...set].sort((a, b) => a - b); render();
    } else if (el.dataset.obGday != null) {
      const i = Number(el.dataset.obGday), set = new Set((d.gymDays || []).map(Number));
      if (el.checked) set.add(i); else set.delete(i);
      d.gymDays = [...set].sort((a, b) => a - b); if (d.gymDays.length >= 2) d.days = d.gymDays.length;
      ob.error = null; render();
    } else if (el.dataset.obSmatch != null) {
      const s = d.extraSport, i = Number(el.dataset.obSmatch);
      s.match = el.checked ? i : null;
      if (el.checked) s.days = (s.days || []).map(Number).filter(x => x !== i);
      render();
    }
    else if (el.dataset.obEq) { ob.eq.items[el.dataset.obEq] = el.checked; }
    else if (el.dataset.obFlag) { ob.eq[el.dataset.obFlag] = el.type === 'checkbox' ? el.checked : el.value === 'ja'; }
    else if (el.dataset.obMulti) {
      const k = el.dataset.obMulti; const set = new Set(d[k] || []);
      if (el.checked) set.add(el.value); else set.delete(el.value);
      d[k] = [...set]; if (k === 'focus' && d.focus.length > 2) d.focus = d.focus.slice(0, 2);
      render();
    } else if (el.dataset.obSport) {
      const k = el.dataset.obSport, s = d.extraSport;
      if (el.type === 'checkbox') s[k] = el.checked; else s[k] = k === 'type' ? el.value : Number(el.value);
      if (k === 'type') { const sp = SPORTS[s.type] || {}; s.prevention = !!(sp.throw || sp.jump); s.power = true; }
      render();
    }
    state.onboardingDraft = ob; save();
    return;
  }
  if (el.dataset.place) {
    const l = state.dayLimits || { regions: [], muscles: [] };
    l.home = el.value === 'home'; l.date = todayISO();
    state.dayLimits = hasDayLimits(l) ? l : null;
    save(); render(); toast(l.home ? 'Heute zuhause: Die Einheit ist auf Körpergewicht umgestellt.' : 'Heute im Kraftraum: Einheit wie geplant.');
    return;
  }
  if (el.dataset.lim) {
    const k = el.dataset.lim, l = state.dayLimits || { regions: [], muscles: [] };
    const set = new Set(l[k] || []);
    if (el.checked) set.add(el.value); else set.delete(el.value);
    l[k] = [...set]; l.date = todayISO();
    state.dayLimits = hasDayLimits(l) ? l : null; ui.limOpen = true;
    save(); render(); return;
  }
  if (el.dataset.eq) { if (setEq(el.dataset.eq, el)) { save(); if (el.type === 'checkbox') { ui.eqOpen = true; render(); } } return; }
  if (el.dataset.set) {
    const k = el.dataset.set;
    state.settings[k] = el.type === 'checkbox' ? el.checked : (k === 'restAdjust' ? Number(el.value) : el.value);
    if (k === 'wakeLock') { if (el.checked) requestWakeLock(); else releaseWakeLock(); }
    save(); render(); return;
  }
  if (el.dataset.nu) { state.settings.nutrition[el.dataset.nu] = Number(el.value); save(); render(); return; }
  if (el.dataset.prof && state.profile) {
    const k = el.dataset.prof;
    if (k === 'sex') state.profile.sex = el.value;
    else {
      const n = parseNum(el.value);
      const lim = { age: [14, 100], heightCm: [120, 230], weightKg: [35, 250], bodyFatPct: [3, 60] }[k];
      if (el.value.trim() === '') state.profile[k] = null;
      else if (isNaN(n) || n < lim[0] || n > lim[1]) { el.setAttribute('aria-invalid', 'true'); toast(`Bitte einen Wert zwischen ${lim[0]} und ${lim[1]} eingeben.`); return; }
      else {
        state.profile[k] = n;
        if (k === 'weightKg') { const t = todayISO(); const b = state.body.find(x => x.date === t); if (b) b.weightKg = n; else state.body.push({ date: t, weightKg: n }); }
      }
    }
    save(); render(); return;
  }
  if (el.dataset.ui) { ui[el.dataset.ui] = el.value; render(); return; }
  if (el.dataset.ci) return;
  if (el.dataset.wf === 'rir') { const x = state.active.exercises[Number(el.dataset.wx)]; x.sets[Number(el.dataset.ws)].rir = el.value === '' ? '' : Number(el.value); save(); }
}
function onInput(e) {
  const el = e.target;
  if (el.id === 'pcKg') { updatePlates(); return; }
  if (el.dataset.wf && el.dataset.wf !== 'rir' && state.active) {
    const x = state.active.exercises[Number(el.dataset.wx)];
    x.sets[Number(el.dataset.ws)][el.dataset.wf] = el.value;
    el.removeAttribute('aria-invalid');
    save(); return;
  }
  if (el.dataset.wnotes != null && state.active) {
    if (el.dataset.wnotes === 'session') state.active.notes = el.value;
    else state.active.exercises[Number(el.dataset.wnotes)].notes = el.value;
    save(); return;
  }
  if (ui.onboarding && el.dataset.ob && (el.type === 'text' || el.tagName === 'INPUT' && el.type !== 'checkbox' && el.type !== 'radio')) {
    ui.onboarding.data[el.dataset.ob] = el.value; state.onboardingDraft = ui.onboarding; save();
  }
}
function onSubmit(e) {
  const f = e.target;
  if (f.dataset.form !== 'body') return;
  e.preventDefault();
  const fd = new FormData(f);
  const date = String(fd.get('date') || '');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { toast('Bitte ein gültiges Datum wählen.'); return; }
  const entry = { date };
  const lim = { weightKg: [30, 300], waist: [40, 200], chest: [50, 200], arm: [15, 70], thigh: [25, 120] };
  let any = false;
  for (const k of Object.keys(lim)) {
    const raw = String(fd.get(k) || '').trim();
    if (!raw) continue;
    const n = parseNum(raw);
    if (isNaN(n) || n < lim[k][0] || n > lim[k][1]) { toast(`Ungültiger Wert bei „${k === 'weightKg' ? 'Gewicht' : k}“ (${lim[k][0]}–${lim[k][1]}).`); const inp = f.querySelector(`[name="${k}"]`); if (inp) { inp.setAttribute('aria-invalid', 'true'); inp.focus(); } return; }
    entry[k] = n; any = true;
  }
  if (!any) { toast('Bitte mindestens einen Wert eintragen.'); return; }
  const ex = state.body.find(b => b.date === date);
  if (ex) Object.assign(ex, entry); else state.body.push(entry);
  if (entry.weightKg && state.profile) state.profile.weightKg = entry.weightKg;
  save(); render(); toast('Körperwerte gespeichert.');
}

/* Offline-Betrieb: Service Worker (sw.js) nur über http(s) – beim Öffnen als lokale Datei nicht möglich */
function registerServiceWorker() {
  try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {}); }
  catch (e) { /* optional */ }
}
/* Browser um dauerhaften Speicher bitten, damit er die Daten nicht von selbst aufräumt */
function requestPersistentStorage() {
  try {
    if (!navigator.storage || !navigator.storage.persist) return;
    navigator.storage.persisted().then(p => (p ? true : navigator.storage.persist())).then(ok => {
      const changed = storageState.persisted !== !!ok;
      storageState.persisted = !!ok;
      if (changed && ui.tab === 'profil' && !ui.onboarding) render();
    }).catch(() => {});
  } catch (e) { /* optional */ }
}
function init() {

    if (!el || el.disabled) return;
    const fn = ACTIONS[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);
  document.addEventListener('submit', onSubmit);
  document.addEventListener('toggle', e => { const d = e.target; if (d && d.dataset && d.dataset.details) ui[d.dataset.details] = d.open; }, true);
  $('#themeBtn').addEventListener('click', () => {
    const order = ['system', 'light', 'dark'];
    state.settings.theme = order[(order.indexOf(state.settings.theme) + 1) % 3];
    save(); applyTheme(); render();
    toast('Farbschema: ' + { system: 'System', light: 'Hell', dark: 'Dunkel' }[state.settings.theme]);
  });
  $('#dlg').addEventListener('close', () => { if (dlgResolve) { const r = dlgResolve; dlgResolve = null; r(false); } ui.swapCtx = ui.swapCtx && null; });
  $('#dlg').addEventListener('click', e => { if (e.target.id === 'dlg') closeDialog(); }); // Klick auf Hintergrund
  window.addEventListener('hashchange', () => {
    const t = takeSyncLink();
    if (t) { if (sync) toast('Dieses Gerät ist bereits mit dem Online-Sync verbunden.'); else openSyncSetup(t); return; }
    ui.tab = parseHash(); render(); $('#main').focus({ preventScroll: true });
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (state.active) requestWakeLock(); tickTimer(); } syncOnVisibility(); });
  window.addEventListener('online', () => { if (sync) syncNow(); });
  window.addEventListener('focus', syncOnVisibility); // Desktop: Fensterwechsel ändert die Sichtbarkeit nicht
  setInterval(updateElapsed, 30000);
  setInterval(syncTick, 60000);
  registerServiceWorker();
  if (state.profile) requestPersistentStorage();
  render();
  if (state.active) requestWakeLock();
  if (sync) syncNow();
  else if (linkToken) openSyncSetup(linkToken);
  if (sync && linkToken) toast('Dieses Gerät ist bereits mit dem Online-Sync verbunden.');
  // Automatischer Selbsttest (leichte Stufe) nach dem ersten Rendern – Ergebnis in der Konsole
  const boot = () => { try { const r = runSelfTest({ level: 'boot' }); if (!ui.selfTest) ui.selfTest = r; } catch (e) { console.error('[Muskelplan Selbsttest] Abbruch:', e); } };
  if ('requestIdleCallback' in window) requestIdleCallback(boot, { timeout: 3000 }); else setTimeout(boot, 800);
}
if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
</script>
</body>
